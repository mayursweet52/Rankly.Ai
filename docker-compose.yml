version: '3.8'

services:
  rankly-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rankly-ai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - .:/app
      - /app/node_modules
      - ./prisma:/app/prisma
      - ./rankly.db:/app/rankly.db
      - ./sessions.db:/app/sessions.db
      - ./uploads:/app/uploads
      - ./backups:/app/backups
