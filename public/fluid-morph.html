<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderful Tools — Fluid Vector Motion Morph</title>
    <!-- GSAP for Smooth Elastic Curves -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Flubber for Mathematical 2D Shape Morphing -->
    <script src="/js/flubber.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --canvas-bg: #EBE4F7;
            --canvas-glow: radial-gradient(circle at 50% 45%, #F7F3FD 0%, #EBE4F7 60%, #DFD4F2 100%);
            --ink-black: #0E0D14;
            --ink-subtle: #706880;
            --accent-coral: #D95D39;
            --accent-teal: #5B998C;
            --accent-emerald: #10B981;
            --accent-blue: #3B82F6;
        }

        body {
            background-color: var(--canvas-bg);
            background: var(--canvas-glow);
            color: var(--ink-black);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Reel Header Badge matching original reel */
        .reel-header {
            position: absolute;
            top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            z-index: 30;
            text-align: center;
        }

        .reel-tagline {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #7B728F;
        }

        .reel-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #1A1724;
        }

        /* Center Animation Stage */
        .stage-container {
            position: relative;
            width: 520px;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Master SVG Canvas */
        .master-svg {
            width: 460px;
            height: 460px;
            overflow: visible;
            filter: drop-shadow(0 25px 40px rgba(50, 40, 75, 0.10));
        }

        /* The Main Vector Morphing Path (No hardcoded fill in CSS!) */
        #mainMorphPath {
            transform-origin: 250px 250px;
            transition: stroke 0.6s ease;
        }

        /* Internal Elements Group */
        .internal-group {
            transform-origin: 250px 250px;
            pointer-events: none;
        }

        /* Bottom Scene Indicator */
        .scene-indicator {
            position: absolute;
            bottom: 40px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            padding: 8px 22px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: #554D68;
            pointer-events: none;
            z-index: 30;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Header matching Bento Motion aesthetic -->
    <header class="reel-header">
        <div class="reel-tagline">Continuous Vector Path Morphing</div>
        <div class="reel-title">Wonderful Tools in Motion</div>
    </header>

    <!-- Center Stage -->
    <main class="stage-container">
        <svg class="master-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="pebbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#D95D39" />
                    <stop offset="100%" stop-color="#5B998C" />
                </linearGradient>

                <linearGradient id="siriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3B82F6" />
                    <stop offset="50%" stop-color="#8B5CF6" />
                    <stop offset="100%" stop-color="#EC4899" />
                </linearGradient>

                <linearGradient id="scannerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#D95D39" stop-opacity="0" />
                    <stop offset="50%" stop-color="#D95D39" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#D95D39" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- 1. The Core Morphed Vector Path (Flubber continuously computes its d attribute) -->
            <path id="mainMorphPath" d="M 250,190 C 283,190 310,217 310,250 C 310,283 283,310 250,310 C 217,310 190,283 190,250 C 190,217 217,190 250,190 Z" fill="#0E0D14" />

            <!-- 2. Dual Internal Detail Layers for Spring Cross-Morphing -->
            <g id="layerA" class="internal-group"></g>
            <g id="layerB" class="internal-group"></g>
        </svg>

        <!-- Scene Caption -->
        <div class="scene-indicator" id="captionText">1/8 · Origin Sphere</div>
    </main>

    <!-- Kinetic Morph Engine -->
    <script>
        const mainPath = document.getElementById('mainMorphPath');
        const layerA = document.getElementById('layerA');
        const layerB = document.getElementById('layerB');
        const caption = document.getElementById('captionText');

        // The 8 Morphing Stages with their exact SVG path geometries & internal content
        const sequence = [
            // Stage 0: Initial Origin Dot / Sphere
            {
                title: "1/8 · Origin Pulse",
                path: "M 250,190 C 283,190 310,217 310,250 C 310,283 283,310 250,310 C 217,310 190,283 190,250 C 190,217 217,190 250,190 Z",
                fill: "#0E0D14",
                render: () => `
                    <circle cx="250" cy="250" r="14" fill="#FAF6FE" />
                `
            },
            // Stage 1: Melts into Candidate 3D Card
            {
                title: "2/8 · Candidate Profile Card",
                path: "M 140,170 C 140,150 155,150 175,150 L 325,150 C 345,150 360,150 360,170 L 360,330 C 360,350 345,350 325,350 L 175,350 C 155,350 140,350 140,330 Z",
                fill: "#FFFFFF",
                render: () => `
                    <circle cx="195" cy="205" r="22" fill="#EBE4F7" />
                    <circle cx="195" cy="200" r="10" fill="#7A728E" />
                    <path d="M 181,220 C 183,212 207,212 209,220 Z" fill="#7A728E" />
                    
                    <circle cx="214" cy="218" r="8" fill="#10B981" />
                    <path d="M 211,218 L 213,220 L 218,216" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

                    <rect x="230" y="195" width="75" height="10" rx="5" fill="#0E0D14" />
                    <rect x="230" y="212" width="50" height="7" rx="3.5" fill="#A49CB5" />

                    <rect x="165" y="250" width="50" height="16" rx="8" fill="#F4EFEA" stroke="#D95D39" stroke-width="1.5" />
                    <text x="190" y="261" font-size="8" font-weight="800" text-anchor="middle" fill="#D95D39">AI ENG</text>

                    <rect x="222" y="250" width="52" height="16" rx="8" fill="#EEF7F5" stroke="#5B998C" stroke-width="1.5" />
                    <text x="248" y="261" font-size="8" font-weight="800" text-anchor="middle" fill="#5B998C">NVIDIA</text>

                    <rect x="280" y="250" width="55" height="16" rx="8" fill="#F3F0FA" stroke="#7A728E" stroke-width="1.5" />
                    <text x="307" y="261" font-size="8" font-weight="800" text-anchor="middle" fill="#7A728E">SYSTEMS</text>

                    <rect x="165" y="285" width="170" height="8" rx="4" fill="#EBE4F7" />
                    <rect x="165" y="285" width="145" height="8" rx="4" fill="#D95D39" />
                `
            },
            // Stage 2: Card splits / morphs into 6 OTP Boxes
            {
                title: "3/8 · 6-Digit Auth Verification",
                path: "M 110,210 C 110,195 125,195 140,195 L 360,195 C 375,195 390,195 390,210 L 390,290 C 390,305 375,305 360,305 L 140,305 C 125,305 110,305 110,290 Z",
                fill: "#FAF6FE",
                render: () => `
                    <rect x="125" y="215" width="34" height="46" rx="8" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2.5" />
                    <text x="142" y="247" font-size="22" font-weight="900" text-anchor="middle" fill="#0E0D14">8</text>

                    <rect x="167" y="215" width="34" height="46" rx="8" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2.5" />
                    <text x="184" y="247" font-size="22" font-weight="900" text-anchor="middle" fill="#0E0D14">4</text>

                    <rect x="209" y="215" width="34" height="46" rx="8" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2.5" />
                    <text x="226" y="247" font-size="22" font-weight="900" text-anchor="middle" fill="#0E0D14">2</text>

                    <rect x="251" y="215" width="34" height="46" rx="8" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2.5" />
                    <text x="268" y="247" font-size="22" font-weight="900" text-anchor="middle" fill="#0E0D14">9</text>

                    <rect x="293" y="215" width="34" height="46" rx="8" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2.5" />
                    <text x="310" y="247" font-size="22" font-weight="900" text-anchor="middle" fill="#0E0D14">1</text>

                    <rect x="335" y="215" width="34" height="46" rx="8" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2.5" />
                    <text x="352" y="247" font-size="22" font-weight="900" text-anchor="middle" fill="#0E0D14">7</text>

                    <text x="250" y="282" font-size="10" font-weight="800" text-anchor="middle" fill="#5B998C" letter-spacing="1.5">VERIFIED 2FA TOKEN</text>
                `
            },
            // Stage 3: OTP boxes fuse into ATS Resume Sheet with Laser
            {
                title: "4/8 · ATS Resume Document Scanner",
                path: "M 170,120 C 170,105 185,105 205,105 L 295,105 C 315,105 330,105 330,120 L 330,380 C 330,395 315,395 295,395 L 205,395 C 185,395 170,395 170,380 Z",
                fill: "#FFFFFF",
                render: () => `
                    <rect x="195" y="140" width="70" height="9" rx="4.5" fill="#0E0D14" />
                    <rect x="195" y="165" width="110" height="5" rx="2.5" fill="#DFD4F2" />
                    <rect x="195" y="180" width="95" height="5" rx="2.5" fill="#DFD4F2" />
                    <rect x="195" y="195" width="105" height="5" rx="2.5" fill="#DFD4F2" />
                    
                    <rect x="195" y="220" width="80" height="5" rx="2.5" fill="#5B998C" />
                    <rect x="195" y="235" width="110" height="5" rx="2.5" fill="#DFD4F2" />
                    <rect x="195" y="250" width="90" height="5" rx="2.5" fill="#DFD4F2" />

                    <rect x="195" y="275" width="105" height="5" rx="2.5" fill="#DFD4F2" />
                    <rect x="195" y="290" width="75" height="5" rx="2.5" fill="#DFD4F2" />

                    <g id="laserScannerGroup">
                        <line x1="160" y1="210" x2="340" y2="210" stroke="#D95D39" stroke-width="3" stroke-linecap="round" />
                        <rect x="170" y="202" width="160" height="16" fill="url(#scannerGlow)" />
                    </g>
                `
            },
            // Stage 4: Document rolls into 98% Match Radial Gauge
            {
                title: "5/8 · 98% Calibrated Score Gauge",
                path: "M 250,140 C 310,140 360,190 360,250 C 360,310 310,360 250,360 C 190,360 140,310 140,250 C 140,190 190,140 250,140 Z",
                fill: "#FFFFFF",
                render: () => `
                    <circle cx="250" cy="250" r="82" fill="none" stroke="#EBE4F7" stroke-width="14" stroke-linecap="round" />
                    <path d="M 192,308 A 82,82 0 1,1 308,308" fill="none" stroke="#D95D39" stroke-width="14" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="60" />

                    <text x="250" y="246" font-size="46" font-weight="900" text-anchor="middle" fill="#0E0D14" letter-spacing="-0.04em">98<tspan font-size="24" fill="#D95D39">%</tspan></text>
                    <text x="250" y="274" font-size="10" font-weight="800" text-anchor="middle" fill="#5B998C" letter-spacing="2">JOB MATCH FIT</text>
                `
            },
            // Stage 5: Gauge unrolls into Voice AI Waveform Bars
            {
                title: "6/8 · AI Voice Interview Soundwave",
                path: "M 120,230 C 120,215 135,215 150,215 L 350,215 C 365,215 380,215 380,230 L 380,270 C 380,285 365,285 350,285 L 150,285 C 135,285 120,285 120,270 Z",
                fill: "#FAF6FE",
                render: () => `
                    <g transform="translate(0, 0)">
                        <rect class="kinetic-bar" x="145" y="235" width="8" height="30" rx="4" fill="#D95D39" />
                        <rect class="kinetic-bar" x="168" y="215" width="8" height="70" rx="4" fill="#5B998C" />
                        <rect class="kinetic-bar" x="191" y="200" width="8" height="100" rx="4" fill="#0E0D14" />
                        <rect class="kinetic-bar" x="214" y="180" width="8" height="140" rx="4" fill="#D95D39" />
                        <rect class="kinetic-bar" x="237" y="170" width="8" height="160" rx="4" fill="#5B998C" />
                        <rect class="kinetic-bar" x="260" y="185" width="8" height="130" rx="4" fill="#0E0D14" />
                        <rect class="kinetic-bar" x="283" y="205" width="8" height="90" rx="4" fill="#D95D39" />
                        <rect class="kinetic-bar" x="306" y="220" width="8" height="60" rx="4" fill="#5B998C" />
                        <rect class="kinetic-bar" x="329" y="235" width="8" height="30" rx="4" fill="#0E0D14" />
                    </g>
                    <text x="250" y="325" font-size="10" font-weight="800" text-anchor="middle" fill="#7A728E" letter-spacing="2">SPEECH PROSODY ENGINE</text>
                `
            },
            // Stage 6: Soundwaves collapse into HRMS Attendance Clock
            {
                title: "7/8 · HRMS Attendance Dial",
                path: "M 250,130 C 316,130 370,184 370,250 C 370,316 316,370 250,370 C 184,370 130,316 130,250 C 130,184 184,130 250,130 Z",
                fill: "#FFFFFF",
                render: () => `
                    <circle cx="250" cy="250" r="105" fill="none" stroke="#EBE4F7" stroke-width="4" />
                    <circle cx="250" cy="155" r="4" fill="#0E0D14" />
                    <circle cx="345" cy="250" r="4" fill="#0E0D14" />
                    <circle cx="250" cy="345" r="4" fill="#0E0D14" />
                    <circle cx="155" cy="250" r="4" fill="#0E0D14" />

                    <line id="hourHand" x1="250" y1="250" x2="250" y2="185" stroke="#0E0D14" stroke-width="7" stroke-linecap="round" />
                    <line id="minuteHand" x1="250" y1="250" x2="305" y2="250" stroke="#D95D39" stroke-width="5" stroke-linecap="round" />
                    <circle cx="250" cy="250" r="8" fill="#0E0D14" />

                    <rect x="175" y="285" width="65" height="22" rx="11" fill="#EEF7F5" stroke="#10B981" stroke-width="1.5" />
                    <circle cx="188" cy="296" r="4" fill="#10B981" />
                    <text x="212" y="299" font-size="9" font-weight="800" fill="#10B981">IN 09:00</text>

                    <rect x="255" y="285" width="70" height="22" rx="11" fill="#FDF3F1" stroke="#D95D39" stroke-width="1.5" />
                    <circle cx="268" cy="296" r="4" fill="#D95D39" />
                    <text x="294" y="299" font-size="9" font-weight="800" fill="#D95D39">OUT 18:00</text>
                `
            },
            // Stage 7: Clock morphs into Rankly Pebble Brand Mark
            {
                title: "8/8 · Rankly Pebble Brand Mark",
                path: "M 195,155 C 290,135 355,185 330,275 C 305,335 210,350 170,295 C 135,240 150,175 195,155 Z",
                fill: "url(#pebbleGrad)",
                render: () => `
                    <text x="246" y="278" font-size="92" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="-0.04em">R</text>
                    <text x="250" y="325" font-size="12" font-weight="800" text-anchor="middle" fill="#FFFFFF" opacity="0.9" letter-spacing="3">RANKLY.AI</text>
                `
            }
        ];

        let currentIndex = 0;
        let activeLayer = layerA;
        let incomingLayer = layerB;

        // Initialize First Stage
        activeLayer.innerHTML = sequence[0].render();
        mainPath.setAttribute('d', sequence[0].path);
        mainPath.style.fill = sequence[0].fill;
        caption.textContent = sequence[0].title;

        function runNextMorph() {
            const nextIndex = (currentIndex + 1) % sequence.length;
            const cur = sequence[currentIndex];
            const nxt = sequence[nextIndex];

            // 1. Update live indicator
            caption.textContent = nxt.title;

            // 2. Set up incoming content
            incomingLayer.innerHTML = nxt.render();
            gsap.set(incomingLayer, { opacity: 0, scale: 0.55 });

            // 3. True Flubber Vector Interpolation
            const interpolator = flubber.interpolate(cur.path, nxt.path, {
                maxSegmentLength: 2,
                string: true
            });

            // 4. GSAP Timeline with 1.1s Smooth Visible Morph
            const tl = gsap.timeline({
                onComplete: () => {
                    currentIndex = nextIndex;
                    // Swap layers
                    const temp = activeLayer;
                    activeLayer = incomingLayer;
                    incomingLayer = temp;
                    incomingLayer.innerHTML = '';

                    // Stage-specific secondary kinetic micro-animations
                    if (nextIndex === 3) {
                        const laser = document.getElementById('laserScannerGroup');
                        if (laser) {
                            gsap.fromTo(laser, 
                                { y: -50 }, 
                                { y: 115, duration: 1.0, repeat: 1, yoyo: true, ease: "power1.inOut" }
                            );
                        }
                    }

                    if (nextIndex === 5) {
                        const bars = document.querySelectorAll('.kinetic-bar');
                        bars.forEach((bar) => {
                            gsap.to(bar, {
                                scaleY: 0.3 + Math.random() * 0.9,
                                transformOrigin: "50% 50%",
                                duration: 0.25 + Math.random() * 0.25,
                                repeat: 4,
                                yoyo: true,
                                ease: "sine.inOut"
                            });
                        });
                    }

                    if (nextIndex === 6) {
                        const h = document.getElementById('hourHand');
                        const m = document.getElementById('minuteHand');
                        if (h && m) {
                            gsap.to(m, { rotation: 120, transformOrigin: "250px 250px", duration: 1.2, ease: "power2.out" });
                            gsap.to(h, { rotation: 30, transformOrigin: "250px 250px", duration: 1.2, ease: "power2.out" });
                        }
                    }

                    // Hold on the settled shape for 1.8 seconds, then morph to next
                    setTimeout(runNextMorph, 1800);
                }
            });

            // Morph the vector path geometry continuously over 1.05s with power2.inOut ease
            const tracker = { progress: 0 };
            tl.to(tracker, {
                progress: 1,
                duration: 1.05,
                ease: "power2.inOut",
                onUpdate: () => {
                    mainPath.setAttribute('d', interpolator(tracker.progress));
                }
            }, 0);

            // Animate fill style smoothly
            tl.to(mainPath, {
                fill: nxt.fill,
                duration: 0.8,
                ease: "power2.inOut"
            }, 0);

            // Add slight elastic squash & stretch bounce during the morph!
            tl.to(mainPath, {
                scaleX: 1.06,
                scaleY: 0.94,
                duration: 0.5,
                ease: "power1.out",
                yoyo: true,
                repeat: 1
            }, 0);

            // Outgoing details contract smoothly
            tl.to(activeLayer, {
                opacity: 0,
                scale: 0.35,
                duration: 0.45,
                ease: "power2.in"
            }, 0);

            // Incoming details blossom with back.out elastic spring
            tl.to(incomingLayer, {
                opacity: 1,
                scale: 1,
                duration: 0.75,
                ease: "back.out(1.5)"
            }, 0.35);
        }

        // Auto-play immediately on load
        setTimeout(runNextMorph, 1500);
    </script>
</body>
</html>
