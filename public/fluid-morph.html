    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --canvas-bg: #EBE4F7;
            --canvas-radial: radial-gradient(circle at 50% 48%, #F8F5FD 0%, #EBE4F7 58%, #DFD1F3 100%);
            --ink-black: #0E0D14;
            --ink-muted: #6B6280;
            --brand-coral: #EA580C;
            --brand-teal: #14B8A6;
            --brand-violet: #A855F7;
            --brand-emerald: #10B981;
        }

        body {
            background-color: var(--canvas-bg);
            background: var(--canvas-radial);
            color: var(--ink-black);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Center Animation Arena */
        .stage-arena {
            position: relative;
            width: 600px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Master SVG Canvas */
        .master-svg {
            width: 500px;
            height: 440px;
            overflow: visible;
            filter: drop-shadow(0 32px 64px rgba(35, 25, 55, 0.13));
        }

        /* Core Vector Morph Path */
        #corePath {
            transform-origin: 250px 250px;
            will-change: transform, d, fill;
        }

        /* Detail Groups */
        .detail-group {
            transform-origin: 250px 250px;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* Classic Apple "hello." Cursive Container */
        #helloWrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
            transform-origin: center center;
        }

        .apple-hello-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Bottom Welcome & Scene Pill Badge (Bento Motion Style) */
        .badge-container {
            position: absolute;
            bottom: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 40;
        }

        .caption-pill {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #1A1724;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(40, 30, 60, 0.08);
            padding: 10px 28px;
            border-radius: 999px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pill-icon {
            font-size: 14px;
            line-height: 1;
        }

        .typewriter-cursor {
            display: inline-block;
            width: 2.5px;
            height: 14px;
            background: var(--brand-coral);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>

                const timer = setInterval(() => {
                    if (i < text.length) {
                        typedSpan.textContent += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(timer);
                        resolve();
                    }
                }, speed);
            });
        }

                scaleY: 0.7,
                duration: 0.35,

                scale: 0.1,
                duration: 0.2,
                ease: "power2.in"
            });

                duration: 0.45,
                ease: "power2.inOut"

                opacity: 1,
                scale: 1,
                duration: 0.3,
                ease: "back.out(2)"
            }, 2.1);

            await typingPromise;

            // Settle on the complete "hello." for 1.3 seconds, then morph to Rankly 3D Logo!
            activeTimer = setTimeout(() => {
                bloomRanklyLogo();
            }, 1300);
        }

        // Bloom Rankly 3D Logo from Center
        function bloomRanklyLogo() {
            const logo = stages[0];

            activeGroup = layerCurrent;
            nextGroup = layerIncoming;

            // Prepare logo details in layerCurrent
            layerCurrent.innerHTML = logo.render();
            gsap.set(layerCurrent, { opacity: 0, scale: 0.25, rotation: -8 });
            layerIncoming.innerHTML = '';
            gsap.set(layerIncoming, { opacity: 0 });

            // Flubber interpolate from center bead to Squircle
            const squircleInterpolator = flubber.interpolate(
                "M 250,240 C 255,240 260,245 260,250 C 260,255 255,260 250,260 C 245,260 240,255 240,250 C 240,245 245,240 250,240 Z",
                logo.path,
                { maxSegmentLength: 2, string: true }
            );

            const bloomTl = gsap.timeline({
                onComplete: () => {
                    currentIndex = 0;
                    activeTimer = setTimeout(executeMorphStep, 2200);
                }
            });

            // Fade and shrink "hello."
            bloomTl.to(helloWrapper, {
                opacity: 0,
                scale: 0.4,
                duration: 0.45,
                ease: "power2.in"
            }, 0);

            // Expand Squircle chassis
            const bloomTracker = { t: 0 };
            bloomTl.to(bloomTracker, {
                t: 1,
                duration: 0.9,
                ease: "power3.out",
                onUpdate: () => {
                    corePath.setAttribute('d', squircleInterpolator(bloomTracker.t));
                }
            }, 0.1);

            bloomTl.to(corePath, {
                opacity: 1,
                fill: logo.fill,
                duration: 0.65,
                ease: "power2.inOut"
            }, 0.1);

            // Bento Squash & Stretch settle
            bloomTl.fromTo(corePath, 
                { scaleX: 0.85, scaleY: 1.2 },
                { scaleX: 1, scaleY: 1, duration: 1.15, ease: "elastic.out(1.1, 0.4)" },
                0.35
            );

            // Bloom internal 3D R, aperture, coral leg, teal gem
            bloomTl.to(layerCurrent, {
                opacity: 1,
                scale: 1,
                rotation: 0,
                duration: 0.85,
                ease: "back.out(1.8)"
            }, 0.38);
        }

        // 2. Master Morph Step (60 FPS Flubber Polygon Interpolation + Bento Motion Kinetic Physics)
        function executeMorphStep() {
            const nextIndex = (currentIndex + 1) % stages.length;

            // When full loop finishes, restart with the "hello." intro!
            if (nextIndex === 0) {
                const loopTl = gsap.timeline({
                    onComplete: () => {
                        runIntro();
                    }
                });
                loopTl.to(corePath, { opacity: 0, scale: 0.1, duration: 0.6, ease: "power2.in" }, 0);
                loopTl.to(activeGroup, { opacity: 0, scale: 0.1, duration: 0.5, ease: "power2.in" }, 0);
                return;
            }

            const cur = stages[currentIndex];
            const nxt = stages[nextIndex];

            // 1. Text caption & Icon update
            pillIcon.textContent = nxt.icon;
            typedSpan.textContent = nxt.title;
            typeCursor.style.display = "none";

            // 2. Prepare incoming layer
            nextGroup.innerHTML = nxt.render();
            gsap.set(nextGroup, { opacity: 0, scale: 0.35, rotation: -6 });

            // 3. Mathematical Polygon Morph Interpolator
            const interpolator = flubber.interpolate(cur.path, nxt.path, {
                maxSegmentLength: 2,
                string: true
            });

            // 4. Kinetic GSAP Timeline with Physical Rubber Anticipation & Overshoot
            const tl = gsap.timeline({
                onComplete: () => {
                    currentIndex = nextIndex;
                    // Swap layers
                    const temp = activeGroup;
                    activeGroup = nextGroup;
                    nextGroup = temp;
                    nextGroup.innerHTML = '';

                    // Micro-physics animations for current settled stage
                    if (nextIndex === 1) { // ATS Laser Scan
                        const laser = document.getElementById('laserBeamGroup');
                        if (laser) {
                            gsap.fromTo(laser, 
                                { y: -55 }, 
                                { y: 125, duration: 0.95, repeat: 1, yoyo: true, ease: "power1.inOut" }
                            );
                        }
                    }

                    if (nextIndex === 2) { // 98% Gauge Count-Up!
                        const arc = document.getElementById('gaugeArc');
                        const num = document.getElementById('gaugeNumber');
                        if (arc && num) {
                            gsap.to(arc, { strokeDashoffset: 75, duration: 1.2, ease: "power2.out" });
                            const countObj = { val: 0 };
                            gsap.to(countObj, {
                                val: 98,
                                duration: 1.2,
                                ease: "power2.out",
                                onUpdate: () => {
                                    num.innerHTML = Math.round(countObj.val) + '<tspan font-size="28" fill="#EA580C">%</tspan>';
                                }
                            });
                        }
                    }

                    if (nextIndex === 3) { // Voice Equalizer Harmonic Oscillation
                        const bars = document.querySelectorAll('.audio-bar');
                        bars.forEach((bar) => {
                            gsap.to(bar, {
                                scaleY: 0.2 + Math.random() * 1.0,
                                transformOrigin: "50% 50%",
                                duration: 0.2 + Math.random() * 0.25,
                                repeat: 6,
                                yoyo: true,
                                ease: "sine.inOut"
                            });
                        });
                    }

                    if (nextIndex === 4) { // HRMS Clock Hands Sweeping
                        const h = document.getElementById('hourHand');
                        const m = document.getElementById('minuteHand');
                        if (h && m) {
                            gsap.to(m, { rotation: 120, transformOrigin: "250px 250px", duration: 1.3, ease: "power2.out" });
                            gsap.to(h, { rotation: 30, transformOrigin: "250px 250px", duration: 1.3, ease: "power2.out" });
                        }
                    }

                    // Settle for 1.9 seconds, then morph to next
                    activeTimer = setTimeout(executeMorphStep, 1900);
                }
            });

            // Master Path Morphing (60 FPS Polygon Interpolation)
            const tracker = { t: 0 };
            tl.to(tracker, {
                t: 1,
                duration: 1.05,
                ease: "power3.inOut",
                onUpdate: () => {
                    corePath.setAttribute('d', interpolator(tracker.t));
                }
            }, 0);

            // Animate Fill Color
            tl.to(corePath, {
                fill: nxt.fill,
                duration: 0.75,
                ease: "power2.inOut"
            }, 0);

            // Bento Motion Style Physical Rubber Squash & Stretch
            tl.to(corePath, {
                scaleX: 1.12,
                scaleY: 0.90,
                rotation: -3,
                duration: 0.35,
                ease: "power2.in"
            }, 0);

            tl.to(corePath, {
                scaleX: 0.92,
                scaleY: 1.10,
                rotation: 2,
                duration: 0.35,
                ease: "power2.out"
            }, 0.35);

            tl.to(corePath, {
                scaleX: 1.0,
                scaleY: 1.0,
                rotation: 0,
                duration: 0.45,
                ease: "elastic.out(1.2, 0.45)"
            }, 0.70);

            // Outgoing details physically shrink and rotate out
            tl.to(activeGroup, {
                opacity: 0,
                scale: 0.25,
                rotation: 12,
                duration: 0.42,
                ease: "power2.in"
            }, 0);

            // Incoming details dynamically spring and blossom in
            tl.to(nextGroup, {
                opacity: 1,
                scale: 1,
                rotation: 0,
                duration: 0.78,
                ease: "back.out(1.7)"
            }, 0.38);
        }

        // Helper to jump to any stage directly
        window.goToStage = function(idx) {
            if (activeTimer) clearTimeout(activeTimer);
            gsap.killTweensOf("*");
            if (idx === 0) {
                runIntro();
                return;
            }
            const st = stages[idx];
            currentIndex = idx;
            corePath.setAttribute('d', st.path);
            corePath.style.fill = st.fill;
            gsap.set(corePath, { scale: 1, rotation: 0, opacity: 1 });
            helloWrapper.style.opacity = 0;
            layerCurrent.innerHTML = st.render();
            gsap.set(layerCurrent, { opacity: 1, scale: 1, rotation: 0 });
            layerIncoming.innerHTML = '';
            gsap.set(layerIncoming, { opacity: 0 });
            pillIcon.textContent = st.icon;
            typedSpan.textContent = st.title;
            typeCursor.style.display = "none";
        };

        // Start immediately on load
        window.addEventListener('DOMContentLoaded', () => {
            runIntro();
        });
    </script>
</body>
</html>
