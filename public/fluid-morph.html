<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankly.ai in Motion — Vector Path Morphing</title>
    <!-- GSAP for Smooth Elastic Springs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Flubber for Mathematical 2D Polygon Vertex Interpolation -->
    <script src="/js/flubber.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --canvas-lilac: #EBE4F7;
            --canvas-glow: radial-gradient(circle at 50% 45%, #F8F5FD 0%, #EBE4F7 60%, #DDD1F0 100%);
            --ink-black: #0E0D14;
            --terracotta: #D95D39;
            --teal: #5B998C;
            --emerald: #10B981;
        }

        body {
            background-color: var(--canvas-lilac);
            background: var(--canvas-glow);
            color: var(--ink-black);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Reel Header Badge matching original reel */
        .reel-header {
            position: absolute;
            top: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            z-index: 30;
            text-align: center;
        }

        .reel-subtitle {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #7B728F;
        }

        .reel-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #1A1724;
        }

        /* Center Animation Viewport */
        .stage-viewport {
            position: relative;
            width: 620px;
            height: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Master SVG Canvas */
        .master-svg {
            width: 480px;
            height: 420px;
            overflow: visible;
            filter: drop-shadow(0 25px 45px rgba(45, 35, 65, 0.12));
        }

        /* Core Vector Morph Path */
        #corePath {
            transform-origin: 250px 250px;
        }

        /* Internal Detail Groups */
        .layer-group {
            transform-origin: 250px 250px;
            pointer-events: none;
        }

        /* Dedicated Intro Welcome Text Banner */
        .welcome-hero-banner {
            position: absolute;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            pointer-events: none;
            z-index: 35;
        }

        .welcome-tagline {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #1A1724;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 25px rgba(40, 30, 60, 0.06);
            padding: 10px 28px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .typewriter-cursor {
            display: inline-block;
            width: 2.5px;
            height: 14px;
            background: #D95D39;
            margin-left: 4px;
            vertical-align: middle;
            animation: cursorBlink 0.7s infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Header matching original reel aesthetic -->
    <header class="reel-header">
        <div class="reel-subtitle">Recreated for Rankly.ai · Fluid Vector Motion</div>
        <div class="reel-title">Wonderful Tools in Motion</div>
    </header>

    <!-- Center Stage Viewport -->
    <main class="stage-viewport">
        <svg class="master-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Official Rankly 3D Gradients -->
                <linearGradient id="rk-base" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#2D2D36"/>
                    <stop offset="50%" stop-color="#1A1A20"/>
                    <stop offset="100%" stop-color="#0E0E12"/>
                </linearGradient>

                <linearGradient id="rk-violet" x1="160" y1="120" x2="340" y2="340" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#D8B4FE"/>
                    <stop offset="30%" stop-color="#A855F7"/>
                    <stop offset="100%" stop-color="#6B21A8"/>
                </linearGradient>

                <linearGradient id="rk-coral" x1="220" y1="240" x2="330" y2="350" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#FDBA74"/>
                    <stop offset="40%" stop-color="#FB923C"/>
                    <stop offset="100%" stop-color="#EA580C"/>
                </linearGradient>

                <linearGradient id="rk-gem" x1="300" y1="120" x2="350" y2="170" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#5EEAD4"/>
                    <stop offset="50%" stop-color="#14B8A6"/>
                    <stop offset="100%" stop-color="#0F766E"/>
                </linearGradient>

                <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#EA580C" stop-opacity="0"/>
                    <stop offset="50%" stop-color="#EA580C" stop-opacity="0.9"/>
                    <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
                </linearGradient>
            </defs>

            <!-- 1. The Core Morphed Vector Body (Interpolated by Flubber) -->
            <path id="corePath" d="M 150,160 C 150,135 165,120 190,120 L 310,120 C 335,120 350,135 350,160 L 350,340 C 350,365 335,380 310,380 L 190,380 C 165,380 150,365 150,340 Z" fill="url(#rk-base)" />

            <!-- 2. Dual Internal Detail Groups for Spring Cross-Morphing -->
            <g id="internalGroupA" class="layer-group"></g>
            <g id="internalGroupB" class="layer-group"></g>

            <!-- 3. Cursive "hello." Handwriting Overlay Group -->
            <g id="helloScriptGroup" style="transform-origin: 250px 250px;">
                <!-- Glowing White Cursive "hello." drawn across the Rankly 3D Icon -->
                <path id="helloStroke" d="M 145,265 C 150,225 160,185 175,185 C 185,185 180,215 170,265 C 180,240 200,240 204,265 C 210,278 218,258 226,248 C 234,240 240,240 236,254 C 232,268 220,270 220,260 C 220,250 230,245 238,255 C 248,265 252,270 260,265 C 266,255 272,185 282,185 C 292,185 284,235 286,268 C 292,262 300,185 310,185 C 322,185 312,235 314,268 C 320,265 330,245 342,245 C 354,245 358,256 354,266 C 348,276 336,276 334,266 C 332,256 342,246 350,250 C 358,254 366,264 374,262" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))" />
                <circle id="helloStrokeDot" cx="395" cy="262" r="6" fill="#FFFFFF" style="opacity: 0;" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))" />
            </g>
        </svg>

        <!-- Dynamic Welcome & Scene Banner -->
        <div class="welcome-hero-banner">
            <div class="welcome-tagline" id="captionText">
                <span id="typedText"></span><span class="typewriter-cursor" id="typeCursor"></span>
            </div>
        </div>
    </main>

    <!-- Kinetic Flubber Engine -->
    <script>
        const corePath = document.getElementById('corePath');
        const internalGroupA = document.getElementById('internalGroupA');
        const internalGroupB = document.getElementById('internalGroupB');
        const helloScriptGroup = document.getElementById('helloScriptGroup');
        const helloStroke = document.getElementById('helloStroke');
        const helloStrokeDot = document.getElementById('helloStrokeDot');
        const typedText = document.getElementById('typedText');
        const typeCursor = document.getElementById('typeCursor');

        let loopTimeout = null;

        // Path Geometries for the 7 Continuous Stages
        const stages = [
            // Stage 0: Rankly 3D Official App Icon (Morphed from "hello.")
            {
                title: "WELLCOME TO THE RANKLY.AI HR MANAGMENT SYSTEM",
                path: "M 150,160 C 150,135 165,120 190,120 L 310,120 C 335,120 350,135 350,160 L 350,340 C 350,365 335,380 310,380 L 190,380 C 165,380 150,365 150,340 Z",
                fill: "url(#rk-base)",
                render: () => `
                    <path d="M 195,165 H 260 C 285,165 305,180 305,205 C 305,230 285,245 260,245 H 225 V 335 H 195 V 165 Z" fill="url(#rk-violet)" />
                    <circle cx="255" cy="205" r="14" fill="#FFFFFF" />
                    <path d="M 240,245 L 305,335 H 265 L 210,245 H 240 Z" fill="url(#rk-coral)" />
                    <circle cx="320" cy="150" r="14" fill="url(#rk-gem)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
                `
            },
            // Stage 1: ATS AI Document Scanner
            {
                title: "ATS AI Resume Scanner & Extraction",
                path: "M 160,110 C 160,95 175,95 190,95 L 285,95 L 340,150 L 340,390 C 340,405 325,405 310,405 L 190,405 C 175,405 160,405 160,390 Z",
                fill: "#FFFFFF",
                render: () => `
                    <path d="M 285,95 L 340,150 H 300 C 290,150 285,145 285,135 V 95 Z" fill="#E2D9F3" />
                    <rect x="190" y="150" width="75" height="10" rx="5" fill="#0E0D14" />
                    <rect x="190" y="175" width="120" height="6" rx="3" fill="#D8CCE8" />
                    <rect x="190" y="195" width="105" height="6" rx="3" fill="#D8CCE8" />
                    <rect x="190" y="215" width="115" height="6" rx="3" fill="#D8CCE8" />
                    <rect x="190" y="245" width="85" height="6" rx="3" fill="#14B8A6" />
                    <rect x="190" y="265" width="120" height="6" rx="3" fill="#D8CCE8" />
                    <rect x="190" y="285" width="95" height="6" rx="3" fill="#D8CCE8" />
                    <rect x="190" y="315" width="115" height="6" rx="3" fill="#D8CCE8" />
                    <rect x="190" y="335" width="80" height="6" rx="3" fill="#D8CCE8" />
                    <g id="laserBeamGroup">
                        <line x1="140" y1="230" x2="360" y2="230" stroke="#EA580C" stroke-width="4" stroke-linecap="round" />
                        <rect x="150" y="220" width="200" height="20" fill="url(#laserBeamGrad)" />
                    </g>
                `
            },
            // Stage 2: Calibrated AI Match Gauge (98%)
            {
                title: "98% Calibrated AI Job Match Fit",
                path: "M 250,120 C 322,120 380,178 380,250 C 380,322 322,380 250,380 C 178,380 120,322 120,250 C 120,178 178,120 250,120 Z",
                fill: "#FFFFFF",
                render: () => `
                    <circle cx="250" cy="250" r="95" fill="none" stroke="#EBE4F7" stroke-width="16" stroke-linecap="round" />
                    <path d="M 183,317 A 95,95 0 1,1 317,317" fill="none" stroke="#EA580C" stroke-width="16" stroke-linecap="round" stroke-dasharray="450" stroke-dashoffset="75" />
                    <text x="250" y="246" font-size="54" font-weight="900" text-anchor="middle" fill="#0E0D14" letter-spacing="-0.04em">98<tspan font-size="28" fill="#EA580C">%</tspan></text>
                    <text x="250" y="278" font-size="11" font-weight="800" text-anchor="middle" fill="#14B8A6" letter-spacing="2">JOB MATCH FIT</text>
                `
            },
            // Stage 3: AI Voice Interview Multi-Band Equalizer
            {
                title: "AI Voice Interview Prosody Analysis",
                path: "M 110,225 C 110,210 125,210 140,210 L 360,210 C 375,210 390,210 390,225 L 390,275 C 390,290 375,290 360,290 L 140,290 C 125,290 110,290 110,275 Z",
                fill: "#FAF6FE",
                render: () => `
                    <g transform="translate(0, 0)">
                        <rect class="audio-bar" x="135" y="235" width="8" height="30" rx="4" fill="#EA580C" />
                        <rect class="audio-bar" x="156" y="215" width="8" height="70" rx="4" fill="#A855F7" />
                        <rect class="audio-bar" x="177" y="195" width="8" height="110" rx="4" fill="#14B8A6" />
                        <rect class="audio-bar" x="198" y="180" width="8" height="140" rx="4" fill="#0E0D14" />
                        <rect class="audio-bar" x="219" y="165" width="8" height="170" rx="4" fill="#EA580C" />
                        <rect class="audio-bar" x="240" y="150" width="8" height="200" rx="4" fill="#A855F7" />
                        <rect class="audio-bar" x="261" y="165" width="8" height="170" rx="4" fill="#14B8A6" />
                        <rect class="audio-bar" x="282" y="180" width="8" height="140" rx="4" fill="#0E0D14" />
                        <rect class="audio-bar" x="303" y="195" width="8" height="110" rx="4" fill="#EA580C" />
                        <rect class="audio-bar" x="324" y="215" width="8" height="70" rx="4" fill="#A855F7" />
                        <rect class="audio-bar" x="345" y="235" width="8" height="30" rx="4" fill="#14B8A6" />
                    </g>
                    <text x="250" y="335" font-size="11" font-weight="800" text-anchor="middle" fill="#7A728E" letter-spacing="2">ACOUSTIC PROSODY ANALYSIS</text>
                `
            },
            // Stage 4: HRMS Attendance Clock Dial & Biometrics
            {
                title: "HRMS Biometric Attendance Engine",
                path: "M 250,125 C 319,125 375,181 375,250 C 375,319 319,375 250,375 C 181,375 125,319 125,250 C 125,181 181,125 250,125 Z",
                fill: "#FFFFFF",
                render: () => `
                    <circle cx="250" cy="250" r="110" fill="none" stroke="#EBE4F7" stroke-width="4" />
                    <circle cx="250" cy="150" r="5" fill="#0E0D14" />
                    <circle cx="350" cy="250" r="5" fill="#0E0D14" />
                    <circle cx="250" cy="350" r="5" fill="#0E0D14" />
                    <circle cx="150" cy="250" r="5" fill="#0E0D14" />
                    <line id="hourHand" x1="250" y1="250" x2="250" y2="180" stroke="#0E0D14" stroke-width="8" stroke-linecap="round" />
                    <line id="minuteHand" x1="250" y1="250" x2="310" y2="250" stroke="#EA580C" stroke-width="5" stroke-linecap="round" />
                    <circle cx="250" cy="250" r="9" fill="#0E0D14" />
                    <rect x="175" y="285" width="65" height="22" rx="11" fill="#EEF7F5" stroke="#10B981" stroke-width="1.5" />
                    <circle cx="188" cy="296" r="4" fill="#10B981" />
                    <text x="212" y="299" font-size="9" font-weight="800" fill="#10B981">IN 09:00</text>
                    <rect x="255" y="285" width="70" height="22" rx="11" fill="#FDF3F1" stroke="#EA580C" stroke-width="1.5" />
                    <circle cx="268" cy="296" r="4" fill="#EA580C" />
                    <text x="294" y="299" font-size="9" font-weight="800" fill="#EA580C">OUT 18:00</text>
                `
            },
            // Stage 5: Security Gating Shield & 6-Digit OTP
            {
                title: "Security Gating & 6-Digit OTP Token",
                path: "M 250,120 L 350,165 C 350,280 290,360 250,385 C 210,360 150,280 150,165 Z",
                fill: "#FAF6FE",
                render: () => `
                    <path d="M 250,140 L 330,175 C 330,265 285,335 250,360 C 215,335 170,265 170,175 Z" fill="none" stroke="#D8CCE8" stroke-width="3" />
                    <g transform="translate(0, 0)">
                        <rect x="160" y="225" width="24" height="34" rx="6" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2" />
                        <text x="172" y="248" font-size="16" font-weight="900" text-anchor="middle" fill="#0E0D14">8</text>
                        <rect x="190" y="225" width="24" height="34" rx="6" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2" />
                        <text x="202" y="248" font-size="16" font-weight="900" text-anchor="middle" fill="#0E0D14">4</text>
                        <rect x="220" y="225" width="24" height="34" rx="6" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2" />
                        <text x="232" y="248" font-size="16" font-weight="900" text-anchor="middle" fill="#0E0D14">2</text>
                        <rect x="250" y="225" width="24" height="34" rx="6" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2" />
                        <text x="262" y="248" font-size="16" font-weight="900" text-anchor="middle" fill="#0E0D14">9</text>
                        <rect x="280" y="225" width="24" height="34" rx="6" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2" />
                        <text x="292" y="248" font-size="16" font-weight="900" text-anchor="middle" fill="#0E0D14">1</text>
                        <rect x="310" y="225" width="24" height="34" rx="6" fill="#FFFFFF" stroke="#0E0D14" stroke-width="2" />
                        <text x="322" y="248" font-size="16" font-weight="900" text-anchor="middle" fill="#0E0D14">7</text>
                    </g>
                    <text x="250" y="285" font-size="10" font-weight="800" text-anchor="middle" fill="#14B8A6" letter-spacing="1.5">VERIFIED 2FA TOKEN</text>
                `
            },
            // Stage 6: Candidate Profile Verified Halo
            {
                title: "Candidate Profile & Skill Calibrator",
                path: "M 250,135 C 313,135 365,187 365,250 C 365,313 313,365 250,365 C 187,365 135,313 135,250 C 135,187 187,135 250,135 Z",
                fill: "#FFFFFF",
                render: () => `
                    <circle cx="250" cy="220" r="36" fill="#EBE4F7" />
                    <circle cx="250" cy="210" r="18" fill="#7A728E" />
                    <path d="M 225,246 C 228,230 272,230 275,246 Z" fill="#7A728E" />
                    <circle cx="282" cy="242" r="14" fill="#10B981" />
                    <path d="M 276,242 L 280,246 L 288,238" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
                    <rect x="185" y="275" width="130" height="14" rx="7" fill="#0E0D14" />
                    <rect x="205" y="298" width="90" height="8" rx="4" fill="#EA580C" />
                `
            }
        ];

        let currentIndex = 0;
        let activeGroup = internalGroupA;
        let nextGroup = internalGroupB;

        // Typewriter Effect
        function typeTextAnimation(text, speed = 35) {
            return new Promise((resolve) => {
                typedText.textContent = "";
                typeCursor.style.display = "inline-block";
                let i = 0;
                const interval = setInterval(() => {
                    if (i < text.length) {
                        typedText.textContent += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(interval);
                        resolve();
                    }
                }, speed);
            });
        }

        // Start Intro Sequence: Logo + "hello." + Typewriter Welcome
        async function playIntroSequence() {
            if (loopTimeout) clearTimeout(loopTimeout);

            // Initialize Rankly 3D Logo in center
            const logoStage = stages[0];
            corePath.setAttribute('d', logoStage.path);
            corePath.style.fill = logoStage.fill;
            activeGroup.innerHTML = logoStage.render();

            gsap.set(corePath, { opacity: 1, scale: 1 });
            gsap.set(activeGroup, { opacity: 1, scale: 1 });
            gsap.set(internalGroupB, { opacity: 0 });

            // Reset "hello." stroke
            helloScriptGroup.style.opacity = 1;
            const strokeLen = helloStroke.getTotalLength();
            helloStroke.style.strokeDasharray = strokeLen;
            helloStroke.style.strokeDashoffset = strokeLen;
            helloStrokeDot.style.opacity = 0;

            // Animate cursive "hello." writing across the logo
            gsap.to(helloStroke, {
                strokeDashoffset: 0,
                duration: 1.5,
                ease: "power2.inOut"
            });

            gsap.to(helloStrokeDot, {
                opacity: 1,
                scale: 1,
                duration: 0.25,
                delay: 1.35,
                ease: "back.out(2)"
            });

            // Simultaneously type out: "WELLCOME TO THE RANKLY.AI HR MANAGMENT SYSTEM"
            await typeTextAnimation("WELLCOME TO THE RANKLY.AI HR MANAGMENT SYSTEM", 28);

            // Pause for 2.2 seconds so the user can read the welcome & enjoy the logo + hello
            loopTimeout = setTimeout(() => {
                // Fade out hello gently
                gsap.to(helloScriptGroup, {
                    opacity: 0,
                    scale: 0.7,
                    duration: 0.5,
                    ease: "power2.in",
                    onComplete: () => {
                        currentIndex = 0;
                        executeContinuousLoop();
                    }
                });
            }, 2200);
        }

        // Flubber Continuous 60 FPS Polygon Morphing Loop
        function executeContinuousLoop() {
            const nextIndex = (currentIndex + 1) % stages.length;

            // If we've completed all stages, loop back to the grand Intro Sequence!
            if (nextIndex === 0) {
                const tl = gsap.timeline({
                    onComplete: () => {
                        playIntroSequence();
                    }
                });

                tl.to(corePath, { opacity: 0, scale: 0.3, duration: 0.6, ease: "power2.in" }, 0);
                tl.to(activeGroup, { opacity: 0, scale: 0.3, duration: 0.5, ease: "power2.in" }, 0);
                return;
            }

            const cur = stages[currentIndex];
            const nxt = stages[nextIndex];

            // 1. Update text caption smoothly
            typedText.textContent = nxt.title;
            typeCursor.style.display = "none";

            // 2. Set up incoming details
            nextGroup.innerHTML = nxt.render();
            gsap.set(nextGroup, { opacity: 0, scale: 0.5 });

            // 3. Flubber Mathematical Vector Path Interpolator
            const interpolator = flubber.interpolate(cur.path, nxt.path, {
                maxSegmentLength: 2,
                string: true
            });

            // 4. GSAP Timeline with 1.1s Smooth Elastic Morph
            const tl = gsap.timeline({
                onComplete: () => {
                    currentIndex = nextIndex;
                    // Swap groups
                    const temp = activeGroup;
                    activeGroup = nextGroup;
                    nextGroup = temp;
                    nextGroup.innerHTML = '';

                    // Stage-specific micro-animations
                    if (nextIndex === 1) { // ATS Laser
                        const laser = document.getElementById('laserBeamGroup');
                        if (laser) {
                            gsap.fromTo(laser, 
                                { y: -55 }, 
                                { y: 125, duration: 1.0, repeat: 1, yoyo: true, ease: "power1.inOut" }
                            );
                        }
                    }

                    if (nextIndex === 3) { // Voice Bars
                        const bars = document.querySelectorAll('.audio-bar');
                        bars.forEach((bar) => {
                            gsap.to(bar, {
                                scaleY: 0.3 + Math.random() * 0.9,
                                transformOrigin: "50% 50%",
                                duration: 0.25 + Math.random() * 0.25,
                                repeat: 4,
                                yoyo: true,
                                ease: "sine.inOut"
                            });
                        });
                    }

                    if (nextIndex === 4) { // Clock
                        const h = document.getElementById('hourHand');
                        const m = document.getElementById('minuteHand');
                        if (h && m) {
                            gsap.to(m, { rotation: 120, transformOrigin: "250px 250px", duration: 1.2, ease: "power2.out" });
                            gsap.to(h, { rotation: 30, transformOrigin: "250px 250px", duration: 1.2, ease: "power2.out" });
                        }
                    }

                    // Settle for 1.8 seconds, then morph to next
                    loopTimeout = setTimeout(executeContinuousLoop, 1800);
                }
            });

            // Continuous Path Morphing (60 FPS Polygon Interpolation)
            const morphTracker = { t: 0 };
            tl.to(morphTracker, {
                t: 1,
                duration: 1.05,
                ease: "power2.inOut",
                onUpdate: () => {
                    corePath.setAttribute('d', interpolator(morphTracker.t));
                }
            }, 0);

            // Animate Fill Style
            tl.to(corePath, {
                fill: nxt.fill,
                duration: 0.8,
                ease: "power2.inOut"
            }, 0);

            // Snappy Elastic Squash & Stretch
            tl.to(corePath, {
                scaleX: 1.05,
                scaleY: 0.95,
                duration: 0.5,
                ease: "power1.out",
                yoyo: true,
                repeat: 1
            }, 0);

            // Outgoing details contract
            tl.to(activeGroup, {
                opacity: 0,
                scale: 0.3,
                duration: 0.4,
                ease: "power2.in"
            }, 0);

            // Incoming details spring out
            tl.to(nextGroup, {
                opacity: 1,
                scale: 1,
                duration: 0.75,
                ease: "back.out(1.5)"
            }, 0.35);
        }

        // Start automatically on load
        window.addEventListener('DOMContentLoaded', () => {
            playIntroSequence();
        });
    </script>
</body>
</html>
