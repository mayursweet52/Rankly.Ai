<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderful Tools Recreated — Exact Bento Reel Motion Experience</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="/css/bentoReelExact.css" rel="stylesheet"/>
</head>
<body class="bento-exact-body">

    <!-- Top Controller Bar -->
    <header class="bento-top-pill">
        <span class="bento-pill-author">@bentomotion.studio recreation</span>
        <div class="bento-pill-sep"></div>
        <button class="bento-btn-toggle" onclick="toggleMorphState()">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span id="btnMorphText">Morph to Rankly</span>
        </button>
    </header>

    <!-- ─── 9:16 Vertical Reel Stage (Exact Video Framing & Colors) ─── -->
    <main class="bento-stage-canvas" id="bentoCanvas">

        <!-- Top Header Copy (Exact text from Reel Opening) -->
        <div class="bento-top-headline">
            <p class="bento-credit-tag" id="bentoCreditTag">RECREATED FROM SCRATCH BY BENTOMOTION</p>
            <h1 class="bento-main-title" id="bentoMainTitle">Wonderful Tools<br/>Recreated</h1>
            <p class="bento-sub-caption" id="bentoSubCaption">After Effects shape layer precision</p>
        </div>

        <!-- Center Morph Arena (5 3D Translucent Cones ⇄ Rankly Component Card) -->
        <div class="bento-morph-arena">

            <!-- 5 Translucent Cones (Tangerine, Lime, Strawberry, Grape, Blueberry) -->
            <div class="bento-cones-cluster" id="conesCluster">
                
                <!-- 1. Tangerine Cone -->
                <div class="bento-cone tangerine">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="tangerineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FF9E44" />
                                <stop offset="100%" stop-color="#E85D00" />
                            </linearGradient>
                        </defs>
                        <!-- Rounded Cone Body -->
                        <path d="M20,25 C35,10 65,10 80,25 C90,45 80,85 50,92 C20,85 10,45 20,25 Z" fill="url(#tangerineGrad)" />
                        <!-- Translucent Top Face -->
                        <ellipse cx="50" cy="26" rx="30" ry="16" fill="#FFC285" opacity="0.85" />
                        <ellipse cx="50" cy="26" rx="14" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
                        <line x1="36" y1="26" x2="64" y2="26" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
                    </svg>
                </div>

                <!-- 2. Lime Cone -->
                <div class="bento-cone lime">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#8CE651" />
                                <stop offset="100%" stop-color="#4EAA1E" />
                            </linearGradient>
                        </defs>
                        <path d="M20,25 C35,10 65,10 80,25 C90,45 80,85 50,92 C20,85 10,45 20,25 Z" fill="url(#limeGrad)" />
                        <ellipse cx="50" cy="26" rx="30" ry="16" fill="#B9F594" opacity="0.85" />
                        <ellipse cx="50" cy="26" rx="14" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
                        <line x1="36" y1="26" x2="64" y2="26" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
                    </svg>
                </div>

                <!-- 3. Strawberry Cone -->
                <div class="bento-cone strawberry">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="strawberryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FF5C88" />
                                <stop offset="100%" stop-color="#D9164A" />
                            </linearGradient>
                        </defs>
                        <path d="M20,25 C35,10 65,10 80,25 C90,45 80,85 50,92 C20,85 10,45 20,25 Z" fill="url(#strawberryGrad)" />
                        <ellipse cx="50" cy="26" rx="30" ry="16" fill="#FFA3BD" opacity="0.85" />
                        <ellipse cx="50" cy="26" rx="14" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
                        <line x1="36" y1="26" x2="64" y2="26" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
                    </svg>
                </div>

                <!-- 4. Blueberry Cone -->
                <div class="bento-cone blueberry">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="blueberryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#54ACFF" />
                                <stop offset="100%" stop-color="#0E6CD6" />
                            </linearGradient>
                        </defs>
                        <path d="M20,25 C35,10 65,10 80,25 C90,45 80,85 50,92 C20,85 10,45 20,25 Z" fill="url(#blueberryGrad)" />
                        <ellipse cx="50" cy="26" rx="30" ry="16" fill="#A8D5FF" opacity="0.85" />
                        <ellipse cx="50" cy="26" rx="14" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
                        <line x1="36" y1="26" x2="64" y2="26" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
                    </svg>
                </div>

                <!-- 5. Grape Cone -->
                <div class="bento-cone grape">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="grapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#AB75FF" />
                                <stop offset="100%" stop-color="#6A2BD6" />
                            </linearGradient>
                        </defs>
                        <path d="M20,25 C35,10 65,10 80,25 C90,45 80,85 50,92 C20,85 10,45 20,25 Z" fill="url(#grapeGrad)" />
                        <ellipse cx="50" cy="26" rx="30" ry="16" fill="#D6BAFF" opacity="0.85" />
                        <ellipse cx="50" cy="26" rx="14" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
                        <line x1="36" y1="26" x2="64" y2="26" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
                    </svg>
                </div>

            </div>

            <!-- Rankly.ai Interactive Transformed Component (Morphs into View) -->
            <div class="bento-rankly-feature-card" id="ranklyCard">
                <span class="bento-card-pill ats" id="featurePill">ATS Intelligence</span>
                <h3 class="bento-card-title" id="featureTitle">Deep Resume Scanner</h3>
                <p class="bento-card-sub" id="featureDesc">Calibrated matching against company JD criteria.</p>

                <div class="bento-mini-mockup" id="miniMockup">
                    <div class="bento-mini-row">
                        <span style="font-weight: 700; color: #1E1B26;">Priya Sharma</span>
                        <span style="font-weight: 800; color: #258CF4;">98.4% Match</span>
                    </div>
                    <div style="height: 6px; background: rgba(0,0,0,0.06); border-radius: 99px; overflow: hidden;">
                        <div style="width: 98%; height: 100%; background: linear-gradient(90deg, #FF7A18, #64C82E); border-radius: 99px;"></div>
                    </div>
                    <div class="bento-mini-row" style="color: #6C677A; font-size: 10px;">
                        <span><i class="fa-solid fa-check text-emerald-500 mr-1"></i> Full Stack Calibrated</span>
                        <span>0.4s Ingestion</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Controller & Cycle Dots -->
        <div class="bento-bottom-actions">
            <button class="bento-play-pill-btn" onclick="cycleMorph()">
                <i class="fa-solid fa-play" style="font-size: 11px;"></i>
                <span id="playButtonLabel">Morph To Rankly Component</span>
            </button>
            <div class="bento-indicator-dots">
                <div class="bento-dot active" onclick="setReelState(0)"></div>
                <div class="bento-dot" onclick="setReelState(1)"></div>
                <div class="bento-dot" onclick="setReelState(2)"></div>
                <div class="bento-dot" onclick="setReelState(3)"></div>
            </div>
        </div>

    </main>

    <script>
        const canvas = document.getElementById('bentoCanvas');
        const mainTitle = document.getElementById('bentoMainTitle');
        const subCaption = document.getElementById('bentoSubCaption');
        const creditTag = document.getElementById('bentoCreditTag');
        const playBtnLabel = document.getElementById('playButtonLabel');
        const morphToggleText = document.getElementById('btnMorphText');

        // Rankly Card Elements
        const featurePill = document.getElementById('featurePill');
        const featureTitle = document.getElementById('featureTitle');
        const featureDesc = document.getElementById('featureDesc');
        const miniMockup = document.getElementById('miniMockup');

        let currentState = 0; // 0 = Cones, 1 = ATS, 2 = Interview AI, 3 = Recruiter Queue

        const statesData = [
            {
                tag: "RECREATED FROM SCRATCH BY BENTOMOTION",
                title: "Wonderful Tools<br/>Recreated",
                caption: "After Effects shape layer precision",
                isMorphed: false
            },
            {
                tag: "RANKLY.AI ENGINE",
                title: "ATS Deep<br/>Scanner",
                caption: "Sub-second document extraction",
                isMorphed: true,
                pill: "ATS Intelligence",
                pillClass: "ats",
                cardTitle: "Deep Resume Scanner",
                cardDesc: "Calibrated matching against company JD criteria.",
                mockup: `
                    <div class="bento-mini-row">
                        <span style="font-weight: 700; color: #1E1B26;">Priya Sharma</span>
                        <span style="font-weight: 800; color: #258CF4;">98.4% Match</span>
                    </div>
                    <div style="height: 6px; background: rgba(0,0,0,0.06); border-radius: 99px; overflow: hidden;">
                        <div style="width: 98%; height: 100%; background: linear-gradient(90deg, #FF7A18, #64C82E); border-radius: 99px;"></div>
                    </div>
                    <div class="bento-mini-row" style="color: #6C677A; font-size: 10px;">
                        <span><i class="fa-solid fa-check text-emerald-500 mr-1"></i> Full Stack Calibrated</span>
                        <span>0.4s Ingestion</span>
                    </div>
                `
            },
            {
                tag: "AUTONOMOUS VOICE",
                title: "AI Mock<br/>Interview",
                caption: "Speech-to-speech feedback simulator",
                isMorphed: true,
                pill: "Voice AI",
                pillClass: "interview",
                cardTitle: "Voice Simulator",
                cardDesc: "Real-time verbal articulation & technical probing.",
                mockup: `
                    <div style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px;">
                        <div style="width: 4px; height: 14px; background: #FF3366; border-radius: 99px;"></div>
                        <div style="width: 4px; height: 28px; background: #8C4BF5; border-radius: 99px;"></div>
                        <div style="width: 4px; height: 34px; background: #FF7A18; border-radius: 99px;"></div>
                        <div style="width: 4px; height: 22px; background: #258CF4; border-radius: 99px;"></div>
                        <div style="width: 4px; height: 30px; background: #64C82E; border-radius: 99px;"></div>
                        <div style="width: 4px; height: 16px; background: #FF3366; border-radius: 99px;"></div>
                    </div>
                    <div style="text-align: center; font-size: 10px; font-weight: 700; color: #FF3366;">
                        Active Speech Analysis · 94% Fluency
                    </div>
                `
            },
            {
                tag: "TALENT TRIAGE",
                title: "Recruiter<br/>AI Queue",
                caption: "Ordered by quantified merit",
                isMorphed: true,
                pill: "Pipeline Queue",
                pillClass: "queue",
                cardTitle: "Candidate Pipeline",
                cardDesc: "Multi-stage automated evaluation funnel.",
                mockup: `
                    <div class="bento-mini-row">
                        <span style="font-weight: 700; color: #1E1B26;">Arjun Mehta</span>
                        <span style="font-weight: 800; color: #FF7A18;">Stage: Interview</span>
                    </div>
                    <div class="bento-mini-row" style="color: #6C677A; font-size: 10px;">
                        <span>Score: 91.5%</span>
                        <span style="color: #4AA41E; font-weight: 700;">Shortlisted</span>
                    </div>
                `
            }
        ];

        function applyState(idx) {
            currentState = idx;
            const data = statesData[idx];

            creditTag.textContent = data.tag;
            mainTitle.innerHTML = data.title;
            subCaption.textContent = data.caption;

            if (data.isMorphed) {
                canvas.classList.add('morphed');
                featurePill.textContent = data.pill;
                featurePill.className = `bento-card-pill ${data.pillClass}`;
                featureTitle.textContent = data.cardTitle;
                featureDesc.textContent = data.cardDesc;
                miniMockup.innerHTML = data.mockup;
                playBtnLabel.textContent = "Next Motion Morph";
                morphToggleText.textContent = "Show Cones";
            } else {
                canvas.classList.remove('morphed');
                playBtnLabel.textContent = "Morph To Rankly Component";
                morphToggleText.textContent = "Morph to Rankly";
            }

            // Update dots
            document.querySelectorAll('.bento-dot').forEach((d, i) => {
                if (i === idx) d.classList.add('active');
                else d.classList.remove('active');
            });
        }

        function cycleMorph() {
            const nextIdx = (currentState + 1) % statesData.length;
            applyState(nextIdx);
        }

        function toggleMorphState() {
            if (canvas.classList.contains('morphed')) {
                applyState(0);
            } else {
                applyState(1);
            }
        }

        function setReelState(idx) {
            applyState(idx);
        }
    </script>
</body>
</html>
