<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderful Tools — Exact Reel Sequence</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="/css/reelExactMorph.css" rel="stylesheet"/>
</head>
<body class="reel-fluid-body">

    <div class="morph-stage">

        <!-- 1. Black Circle -->
        <div class="morph-scene active" id="sc-0">
            <div class="ae-dot"></div>
        </div>

        <!-- 2. "hello." -->
        <div class="morph-scene" id="sc-1">
            <div class="ae-hello">hello.</div>
        </div>

        <!-- 3. Classic Mac 128k -->
        <div class="morph-scene" id="sc-2">
            <div class="ae-mac-chassis">
                <div class="ae-mac-screen">hello.</div>
                <div class="ae-mac-slot"></div>
            </div>
        </div>

        <!-- 4. iPod Click Wheel -->
        <div class="morph-scene" id="sc-3">
            <div class="ae-ipod-wheel">
                <span class="ae-ipod-label top">MENU</span>
                <span class="ae-ipod-label bottom">►||</span>
                <span class="ae-ipod-label left">|◄◄</span>
                <span class="ae-ipod-label right">►►|</span>
                <div class="ae-ipod-center"></div>
            </div>
        </div>

        <!-- 5. Touch ID Fingerprint -->
        <div class="morph-scene" id="sc-4">
            <svg class="ae-touchid" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
                <path d="M50,15 A35,35 0 0,1 85,50 A35,35 0 0,1 75,75"/>
                <path d="M50,25 A25,25 0 0,1 75,50 A25,25 0 0,1 68,68"/>
                <path d="M50,35 A15,15 0 0,1 65,50 A15,15 0 0,1 60,62"/>
                <path d="M50,45 A5,5 0 0,1 55,50 A5,5 0 0,1 50,55"/>
                <path d="M50,15 A35,35 0 0,0 15,50 A35,35 0 0,0 25,75"/>
                <path d="M50,25 A25,25 0 0,0 25,50 A25,25 0 0,0 32,68"/>
            </svg>
        </div>

        <!-- 6. Face ID Smile -->
        <div class="morph-scene" id="sc-5">
            <svg class="ae-faceid" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
                <!-- Corners -->
                <path d="M15,30 L15,15 L30,15"/>
                <path d="M70,15 L85,15 L85,30"/>
                <path d="M85,70 L85,85 L70,85"/>
                <path d="M30,85 L15,85 L15,70"/>
                <!-- Eyes & Smile -->
                <circle cx="38" cy="42" r="3" fill="currentColor"/>
                <circle cx="62" cy="42" r="3" fill="currentColor"/>
                <path d="M50,45 L50,55 L44,55"/>
                <path d="M35,62 Q50,74 65,62"/>
            </svg>
        </div>

        <!-- 7. 5 Colorful Gumdrop Cones -->
        <div class="morph-scene" id="sc-6">
            <div class="ae-cones-grid">
                <div style="position: absolute; top: 10px; left: 0;"><svg width="70" height="70" viewBox="0 0 100 100"><ellipse cx="50" cy="30" rx="30" ry="16" fill="#FFC285"/><path d="M20,30 C30,70 70,70 80,30 Z" fill="#FF7300"/><line x1="36" y1="30" x2="64" y2="30" stroke="#FFF" stroke-width="3"/></svg></div>
                <div style="position: absolute; top: 0; right: 40px;"><svg width="70" height="70" viewBox="0 0 100 100"><ellipse cx="50" cy="30" rx="30" ry="16" fill="#B9F594"/><path d="M20,30 C30,70 70,70 80,30 Z" fill="#52C41A"/><line x1="36" y1="30" x2="64" y2="30" stroke="#FFF" stroke-width="3"/></svg></div>
                <div style="position: absolute; top: 70px; right: 0;"><svg width="70" height="70" viewBox="0 0 100 100"><ellipse cx="50" cy="30" rx="30" ry="16" fill="#FFA3BD"/><path d="M20,30 C30,70 70,70 80,30 Z" fill="#FF2D55"/><line x1="36" y1="30" x2="64" y2="30" stroke="#FFF" stroke-width="3"/></svg></div>
                <div style="position: absolute; bottom: 10px; right: 30px;"><svg width="70" height="70" viewBox="0 0 100 100"><ellipse cx="50" cy="30" rx="30" ry="16" fill="#A8D5FF"/><path d="M20,30 C30,70 70,70 80,30 Z" fill="#1890FF"/><line x1="36" y1="30" x2="64" y2="30" stroke="#FFF" stroke-width="3"/></svg></div>
                <div style="position: absolute; bottom: 20px; left: 30px;"><svg width="70" height="70" viewBox="0 0 100 100"><ellipse cx="50" cy="30" rx="30" ry="16" fill="#D6BAFF"/><path d="M20,30 C30,70 70,70 80,30 Z" fill="#722ED1"/><line x1="36" y1="30" x2="64" y2="30" stroke="#FFF" stroke-width="3"/></svg></div>
            </div>
        </div>

        <!-- 8. AirPods Case -->
        <div class="morph-scene" id="sc-7">
            <div class="ae-airpods">
                <div class="ae-airpods-slit"></div>
                <div class="ae-airpods-led"></div>
            </div>
        </div>

        <!-- 9. Siri Waveform -->
        <div class="morph-scene" id="sc-8">
            <svg class="ae-siri-wave" viewBox="0 0 200 60">
                <path d="M0,30 Q50,0 100,30 T200,30" fill="none" stroke="#FF2D55" stroke-width="6" opacity="0.8"/>
                <path d="M0,30 Q50,60 100,30 T200,30" fill="none" stroke="#00F0FF" stroke-width="6" opacity="0.8"/>
                <path d="M0,30 Q50,20 100,30 T200,30" fill="none" stroke="#FFF" stroke-width="3"/>
            </svg>
        </div>

        <!-- 10. Apple Watch Activity Rings -->
        <div class="morph-scene" id="sc-9">
            <svg class="ae-watch-rings" viewBox="0 0 120 120">
                <!-- Move Red -->
                <circle cx="60" cy="60" r="50" stroke="#FF2D55" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="314" stroke-dashoffset="60"/>
                <!-- Exercise Green -->
                <circle cx="60" cy="60" r="37" stroke="#A8FF00" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="232" stroke-dashoffset="50"/>
                <!-- Stand Cyan -->
                <circle cx="60" cy="60" r="24" stroke="#00F0FF" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="150" stroke-dashoffset="30"/>
            </svg>
        </div>

        <!-- 11. Heart Health Pulse -->
        <div class="morph-scene" id="sc-10">
            <svg class="ae-heart" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- 12. Rankly.ai Cloud Finale -->
        <div class="morph-scene" id="sc-11">
            <div class="ae-rankly-os">
                <div style="font-size: 26px; font-weight: 900; color: #0E0D14; letter-spacing: -0.03em;">
                    Rankly<span style="color: #5B998C;">.ai</span>
                </div>
                <div style="font-size: 13px; font-weight: 600; color: #7A7588;">
                    Wonderful Tools For Modern Hiring.
                </div>
            </div>
        </div>

    </div>

    <!-- Automatic Rapid Morph Loop matching Reel Timing (~1.6s per beat) -->
    <script>
        let currentSc = 0;
        const totalSc = 12;
        const scInterval = 1600;

        function stepMorph() {
            document.querySelectorAll('.morph-scene').forEach((el, idx) => {
                if (idx === currentSc) el.classList.add('active');
                else el.classList.remove('active');
            });
            currentSc = (currentSc + 1) % totalSc;
        }

        stepMorph();
        setInterval(stepMorph, scInterval);
    </script>
</body>
</html>
