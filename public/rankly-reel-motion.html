<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankly.ai — Reel Motion Engine</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link href="/css/ranklyVectorMorph.css" rel="stylesheet"/>
</head>
<body class="rankly-vector-morph-body">

    <!-- Center Cinematic Viewport (Continuous Automatic Reel Physics) -->
    <main class="rk-morph-viewport">

        <!-- 1. Black Circle Pulse -->
        <div class="rk-vector-frame active" id="f-0">
            <div class="rk-dot-pulse"></div>
        </div>

        <!-- 2. "rankly." Script (like classic Apple "hello.") -->
        <div class="rk-vector-frame" id="f-1">
            <div class="rk-script-logo">rankly.</div>
        </div>

        <!-- 3. Candidate 3D Auth Card -->
        <div class="rk-vector-frame" id="f-2">
            <div class="rk-vector-auth-card">
                <div class="rk-auth-mock-line">
                    <span>candidate@rankly.ai</span>
                    <i class="fa-solid fa-circle-check text-emerald-500"></i>
                </div>
                <div class="rk-auth-btn-pill">
                    Sign In & Verify
                </div>
            </div>
        </div>

        <!-- 4. 6-Digit Cryptographic OTP Slots -->
        <div class="rk-vector-frame" id="f-3">
            <div class="rk-otp-cells-cluster">
                <div class="rk-otp-cube">8</div>
                <div class="rk-otp-cube">4</div>
                <div class="rk-otp-cube">2</div>
                <div class="rk-otp-cube">9</div>
                <div class="rk-otp-cube">1</div>
                <div class="rk-otp-cube">7</div>
            </div>
            <div style="font-size: 11px; font-weight: 800; color: #10B981; margin-top: 14px; text-transform: uppercase; letter-spacing: 0.1em;">
                <i class="fa-solid fa-shield-halved mr-1"></i> OTP Session Verified
            </div>
        </div>

        <!-- 5. ATS Resume Document Scanning Sweep -->
        <div class="rk-vector-frame" id="f-4">
            <div class="rk-resume-doc-sheet">
                <div class="rk-scan-line-sweep"></div>
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
                    <div style="width: 24px; height: 24px; border-radius: 6px; background: #D95D39;"></div>
                    <div style="width: 70px; height: 8px; background: #0E0D14; border-radius: 4px;"></div>
                </div>
                <div class="rk-doc-line" style="width: 100%;"></div>
                <div class="rk-doc-line" style="width: 85%;"></div>
                <div class="rk-doc-line" style="width: 90%;"></div>
                <div class="rk-doc-line" style="width: 60%;"></div>
                <div class="rk-doc-line" style="width: 75%;"></div>
            </div>
        </div>

        <!-- 6. Radial 98% Score Gauge Arc -->
        <div class="rk-vector-frame" id="f-5">
            <div class="rk-gauge-wrapper">
                <svg class="rk-gauge-dial" viewBox="0 0 200 100">
                    <path d="M 20 85 A 65 65 0 0 1 180 85" fill="none" stroke="#DFCFF4" stroke-width="14" stroke-linecap="round"/>
                    <path d="M 20 85 A 65 65 0 0 1 180 85" fill="none" stroke="#D95D39" stroke-width="14" stroke-linecap="round" stroke-dasharray="204" stroke-dashoffset="18"/>
                </svg>
                <div class="rk-gauge-score-digits">98<span style="font-size: 22px; color: #D95D39;">%</span></div>
                <span style="font-size: 11px; font-weight: 800; color: var(--rk-subtle); text-transform: uppercase; margin-top: 4px;">ATS Match Precision</span>
            </div>
        </div>

        <!-- 7. Recruiter Candidate Pipeline Triage -->
        <div class="rk-vector-frame" id="f-6">
            <div class="rk-triage-stack">
                <div class="rk-triage-row">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 28px; height: 28px; border-radius: 50%; background: #183B33; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px;">P</div>
                        <span class="rk-cand-badge">Priya Sharma</span>
                    </div>
                    <span class="rk-cand-score">98.4%</span>
                </div>
                <div class="rk-triage-row">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 28px; height: 28px; border-radius: 50%; background: #D95D39; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px;">A</div>
                        <span class="rk-cand-badge">Arjun Mehta</span>
                    </div>
                    <span class="rk-cand-score" style="color: #D95D39;">94.1%</span>
                </div>
            </div>
        </div>

        <!-- 8. AI Voice Mock Interview Audio Waveform -->
        <div class="rk-vector-frame" id="f-7">
            <div class="rk-interview-wave-box" id="rkWaveHolder">
                <!-- Dynamically generated bars -->
            </div>
            <p style="font-size: 12px; font-weight: 700; color: var(--rk-subtle); margin-top: 10px;">
                Voice Mock Interview Simulator
            </p>
        </div>

        <!-- 9. HRMS Attendance Dual Punch Clock -->
        <div class="rk-vector-frame" id="f-8">
            <div class="rk-punch-clock-card">
                <div class="rk-time-numbers" id="rkLiveClock">09:41:28 AM</div>
                <div class="rk-punch-pill-duo">
                    <div class="rk-punch-pill-in"><i class="fa-solid fa-arrow-right-to-bracket mr-1"></i> Punch In</div>
                    <div class="rk-punch-pill-out"><i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Punch Out</div>
                </div>
            </div>
        </div>

        <!-- 10. Rankly.ai Finale -->
        <div class="rk-vector-frame" id="f-9">
            <div class="rk-brand-finale-box">
                <div class="rk-brand-finale-title">
                    Rankly<span>.ai</span>
                </div>
                <div class="rk-brand-finale-sub">
                    Wonderful Tools for Modern Hiring.
                </div>
            </div>
        </div>

    </main>

    <!-- Rapid Reel Timing Engine (1.5s per beat, matching reel rhythm) -->
    <script>
        // Generate audio bars
        const waveHolder = document.getElementById('rkWaveHolder');
        if (waveHolder) {
            for (let i = 0; i < 24; i++) {
                const b = document.createElement('div');
                b.className = 'rk-audio-bar';
                b.style.animationDelay = (i * 0.05) + 's';
                b.style.height = (12 + Math.random() * 60) + 'px';
                waveHolder.appendChild(b);
            }
        }

        // Live Clock
        setInterval(() => {
            const clock = document.getElementById('rkLiveClock');
            if (clock) {
                const d = new Date();
                clock.textContent = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
        }, 1000);

        let currentFrame = 0;
        const totalFrames = 10;
        const beatInterval = 1500; // 1.5 seconds per beat

        function nextBeat() {
            document.querySelectorAll('.rk-vector-frame').forEach((el, idx) => {
                if (idx === currentFrame) el.classList.add('active');
                else el.classList.remove('active');
            });
            currentFrame = (currentFrame + 1) % totalFrames;
        }

        // Auto-play immediately on load
        nextBeat();
        setInterval(nextBeat, beatInterval);
    </script>
</body>
</html>
