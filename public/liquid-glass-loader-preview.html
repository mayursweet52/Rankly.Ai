<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Tiles Loading Screen - Preview | Rankly.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        :root {
            --bg-base: #F8F9FD;
            --tile-fill: rgba(255, 255, 255, 0.12);
            --tile-border: rgba(255, 255, 255, 0.45);
            --tile-shadow: 0 12px 30px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --glow-color-1: #7A5CFF;
            --glow-color-2: #FF9AE2;
            --glow-color-3: #FFA14A;
        }

        body.dark-mode {
            --bg-base: #0B0D14;
            --tile-fill: rgba(255, 255, 255, 0.05);
            --tile-border: rgba(255, 255, 255, 0.15);
            --tile-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            --glow-color-1: #5B998C;
            --glow-color-2: #D95D39;
            --glow-color-3: #81E4DA;
        }

        body {
            background-color: var(--bg-base);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: background 0.4s ease;
        }

        /* ─── MULTI-LAYERED RADIAL GLOW ENGINE (FIGMA STEP 4) ─── */
        .glow-background-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        .glow-ellipse {
            position: absolute;
            border-radius: 50%;
            filter: blur(55px);
            opacity: 0.85;
            animation: pulseGlow 5s ease-in-out infinite alternate;
        }

        .glow-ellipse-1 {
            width: 440px;
            height: 440px;
            background: radial-gradient(circle, var(--glow-color-1) 0%, transparent 70%);
            transform: translate(-40px, -30px);
            animation-delay: 0s;
        }

        .glow-ellipse-2 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, var(--glow-color-2) 0%, transparent 70%);
            transform: translate(50px, 40px);
            animation-delay: -1.8s;
        }

        .glow-ellipse-3 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, var(--glow-color-3) 0%, transparent 65%);
            transform: translate(0, 0);
            animation-delay: -3.2s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9) rotate(0deg); opacity: 0.7; }
            50% { transform: scale(1.15) rotate(15deg); opacity: 0.95; }
            100% { transform: scale(1) rotate(-10deg); opacity: 0.8; }
        }

        /* ─── 7x7 LIQUID GLASS TILES GRID (FIGMA STEP 2 & 3) ─── */
        .glass-grid-wrapper {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(7, 56px);
            grid-template-rows: repeat(7, 56px);
            gap: 12px;
            padding: 20px;
        }

        @media (min-width: 640px) {
            .glass-grid-wrapper {
                grid-template-columns: repeat(7, 72px);
                grid-template-rows: repeat(7, 72px);
                gap: 14px;
            }
        }

        .glass-tile {
            position: relative;
            border-radius: 20px;
            background: var(--tile-fill);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--tile-border);
            box-shadow: var(--tile-shadow);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: tileWave 4s ease-in-out infinite;
        }

        /* Fluid Wave Dynamic Animation across 49 tiles */
        @keyframes tileWave {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
        }

        .glass-tile:hover {
            transform: translateY(-8px) scale(1.08) !important;
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18), inset 0 2px 0 rgba(255, 255, 255, 0.9);
            z-index: 20;
        }

        /* ─── CENTER FLOATING GLASS LOADER CARD ─── */
        .loader-center-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 28px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            min-width: 300px;
            text-align: center;
            transition: all 0.4s ease;
        }

        body.dark-mode .loader-center-card {
            background: rgba(18, 20, 31, 0.75);
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        /* Animated Progress Beam */
        .progress-beam-track {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        body.dark-mode .progress-beam-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-beam-fill {
            height: 100%;
            width: 45%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #183B33, #D95D39, #5B998C);
            animation: beamSlide 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes beamSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        /* Floating Control Panel at Top-Right */
        .preview-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 9999px;
            padding: 6px 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        body.dark-mode .preview-controls {
            background: rgba(20, 23, 36, 0.85);
            border-color: rgba(255, 255, 255, 0.12);
            color: white;
        }
    </style>
</head>
<body>

    <!-- ─── FLOATING PREVIEW CONTROLLER ─── -->
    <div class="preview-controls">
        <button onclick="toggleTheme()" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all bg-[#183B33] text-white hover:opacity-90 flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-moon"></i> <span id="themeBtnText">Toggle Dark Mode</span>
        </button>
        <button onclick="switchPalette('rankly')" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all bg-emerald-600 text-white hover:opacity-90 cursor-pointer">
            Rankly Palette
        </button>
        <button onclick="switchPalette('figma')" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all bg-purple-600 text-white hover:opacity-90 cursor-pointer">
            Figma UIUX Palette
        </button>
        <a href="/" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all bg-black/10 dark:bg-white/10 hover:bg-black/20 text-gray-800 dark:text-gray-200 cursor-pointer flex items-center gap-1">
            <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to App
        </a>
    </div>

    <!-- ─── RADIAL GLOW LAYER (FIGMA STEP 4) ─── -->
    <div class="glow-background-container">
        <div class="glow-ellipse glow-ellipse-1" id="glow1"></div>
        <div class="glow-ellipse glow-ellipse-2" id="glow2"></div>
        <div class="glow-ellipse glow-ellipse-3" id="glow3"></div>
    </div>

    <!-- ─── 7x7 LIQUID GLASS TILES (FIGMA STEPS 2, 3, 4) ─── -->
    <div class="glass-grid-wrapper" id="glassGrid">
        <!-- 49 dynamic glass tiles generated by JS with wave delays -->
    </div>

    <!-- ─── CENTER LIQUID GLASS LOADER CARD ─── -->
    <div class="loader-center-card">
        <!-- Custom Gradient Emblem Logo for Rankly.ai -->
        <svg width="42" height="42" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="animate-bounce">
            <defs>
                <linearGradient id="g1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#B588F7"/>
                    <stop offset="100%" stop-color="#8E65DF"/>
                </linearGradient>
                <linearGradient id="g2" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#FFA14A"/>
                    <stop offset="100%" stop-color="#F06A4A"/>
                </linearGradient>
                <linearGradient id="g3" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#81E4DA"/>
                    <stop offset="100%" stop-color="#45A89E"/>
                </linearGradient>
            </defs>
            <rect width="32" height="32" rx="9" fill="#111111" />
            <path d="M10 8H16.5C19.5 8 21.5 9.8 21.5 12.5C21.5 15.2 19.5 17 16.5 17H13.5V24H10V8Z" fill="url(#g1)"/>
            <circle cx="16.5" cy="12.5" r="2.2" fill="#FFFFFF"/>
            <path d="M15.5 17L21.5 24H17L12 17H15.5Z" fill="url(#g2)"/>
            <circle cx="24" cy="8" r="3" fill="url(#g3)" />
        </svg>

        <div>
            <h2 class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white">
                Rankly<span class="text-[#D95D39]">.ai</span>
            </h2>
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mt-0.5 tracking-wide">
                Initializing Liquid AI Engine...
            </p>
        </div>

        <!-- Progress Track -->
        <div class="progress-beam-track mt-1">
            <div class="progress-beam-fill"></div>
        </div>

        <div class="flex items-center gap-2 text-[11px] font-mono text-gray-500 dark:text-gray-400">
            <i class="fa-solid fa-spinner fa-spin text-emerald-600 dark:text-emerald-400"></i>
            <span id="loadingStatusText">Calibrating ATS models & workspace</span>
        </div>
    </div>

    <script>
        // Generate 7x7 (49 tiles) with diagonal wave ripple delay
        const grid = document.getElementById('glassGrid');
        for (let row = 0; row < 7; row++) {
            for (let col = 0; col < 7; col++) {
                const tile = document.createElement('div');
                tile.className = 'glass-tile';
                const distFromCenter = Math.sqrt(Math.pow(row - 3, 2) + Math.pow(col - 3, 2));
                tile.style.animationDelay = `${(distFromCenter * 0.25).toFixed(2)}s`;
                grid.appendChild(tile);
            }
        }

        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtnText').textContent = isDark ? 'Toggle Light Mode' : 'Toggle Dark Mode';
        }

        // Palette Switcher
        function switchPalette(type) {
            const root = document.documentElement;
            if (type === 'figma') {
                root.style.setProperty('--glow-color-1', '#7A5CFF');
                root.style.setProperty('--glow-color-2', '#FF9AE2');
                root.style.setProperty('--glow-color-3', '#FFA14A');
            } else {
                root.style.setProperty('--glow-color-1', '#183B33');
                root.style.setProperty('--glow-color-2', '#D95D39');
                root.style.setProperty('--glow-color-3', '#5B998C');
            }
        }

        // Dynamic Loading Status Ticker
        const statusMsgs = [
            'Calibrating ATS neural models...',
            'Connecting to secure workspace...',
            'Encrypting AI scoring pipeline...',
            'Liquid Glass Engine Ready ✨'
        ];
        let idx = 0;
        setInterval(() => {
            idx = (idx + 1) % statusMsgs.length;
            const el = document.getElementById('loadingStatusText');
            if (el) el.textContent = statusMsgs[idx];
        }, 1600);
    </script>
</body>
</html>
