<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Liquid Glass Tiles - Pure Visual Fidelity | Rankly.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        :root {
            --bg-color: #F8F9FE;
            --tile-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.15) 100%);
            --tile-border: rgba(255, 255, 255, 0.9);
            --tile-shadow: 0 12px 28px -4px rgba(100, 110, 140, 0.22), inset 0 2px 3px rgba(255, 255, 255, 0.95), inset 0 -2px 3px rgba(0, 0, 0, 0.04);
            --glow-center: #FFA24C;
            --glow-mid: #FF4DA6;
            --glow-outer: #7952FF;
            --text-color: #111111;
        }

        body.dark-mode {
            --bg-color: #07090E;
            --tile-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.03) 100%);
            --tile-border: rgba(255, 255, 255, 0.3);
            --tile-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.8), inset 0 2px 3px rgba(255, 255, 255, 0.5), inset 0 -2px 3px rgba(0, 0, 0, 0.5);
            --glow-center: #D95D39;
            --glow-mid: #81E4DA;
            --glow-outer: #183B33;
            --text-color: #FFFFFF;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
            transition: background 0.4s ease;
        }

        /* ─── STAGE CONTAINER ─── */
        .stage-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 650px;
            margin: 20px auto;
        }

        /* ─── BACKGROUND GLOW (FIGMA EXACT REPLICA) ─── */
        .glow-layers-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(45px);
            animation: fluidPulse 5s ease-in-out infinite alternate;
        }

        .glow-inner {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, var(--glow-center) 0%, var(--glow-mid) 70%, transparent 100%);
            opacity: 0.95;
            z-index: 3;
        }

        .glow-middle {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, var(--glow-mid) 0%, var(--glow-outer) 65%, transparent 100%);
            opacity: 0.85;
            transform: translate(-20px, -10px);
            animation-delay: -1.5s;
            z-index: 2;
        }

        .glow-outer {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, var(--glow-outer) 0%, transparent 70%);
            opacity: 0.65;
            transform: translate(20px, 20px);
            animation-delay: -3s;
            z-index: 1;
        }

        @keyframes fluidPulse {
            0% { transform: scale(0.95) rotate(0deg); opacity: 0.8; }
            50% { transform: scale(1.1) rotate(15deg); opacity: 1; }
            100% { transform: scale(0.98) rotate(-10deg); opacity: 0.85; }
        }

        /* ─── 7x7 LIQUID GLASS TILES GRID ─── */
        .tiles-grid {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(7, 44px);
            grid-template-rows: repeat(7, 44px);
            gap: 10px;
            padding: 12px;
        }

        @media (min-width: 480px) {
            .tiles-grid {
                grid-template-columns: repeat(7, 60px);
                grid-template-rows: repeat(7, 60px);
                gap: 12px;
                padding: 16px;
            }
        }

        @media (min-width: 640px) {
            .tiles-grid {
                grid-template-columns: repeat(7, 74px);
                grid-template-rows: repeat(7, 74px);
                gap: 14px;
                padding: 20px;
            }
        }

        /* Individual Rounded Liquid Glass Cushion Tile */
        .glass-cushion {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            background: var(--tile-bg);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: 1.5px solid var(--tile-border);
            box-shadow: var(--tile-shadow);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: tileBreath 4s ease-in-out infinite;
        }

        @media (min-width: 640px) {
            .glass-cushion {
                border-radius: 22px;
            }
        }

        /* Glossy Top Edge Specular Reflection */
        .glass-cushion::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 4px;
            right: 4px;
            height: 42%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.0) 100%);
            border-radius: 14px 14px 6px 6px;
            pointer-events: none;
        }

        @keyframes tileBreath {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .glass-cushion:hover {
            transform: translateY(-8px) scale(1.12) !important;
            border-color: rgba(255, 255, 255, 1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), inset 0 2px 4px rgba(255, 255, 255, 1);
            z-index: 50;
        }

        /* ─── PURE CRISP LUMINOUS RANKLY OVERLAY ─── */
        .rankly-luminous-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 25;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .brand-title {
            font-size: clamp(34px, 7vw, 54px);
            font-weight: 900;
            letter-spacing: -0.04em;
            color: var(--text-color);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), 0 0 40px rgba(255, 255, 255, 0.9);
            line-height: 1;
            filter: drop-shadow(0 0 15px rgba(217, 93, 57, 0.4));
            animation: brandGlow 3s ease-in-out infinite alternate;
        }

        body.dark-mode .brand-title {
            color: #FFFFFF;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 60px rgba(217, 93, 57, 0.6);
        }

        .brand-dot {
            color: #D95D39;
            text-shadow: 0 0 25px #D95D39, 0 0 50px #FFA14A;
        }

        .brand-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--text-color);
            opacity: 0.85;
            margin-top: 6px;
        }

        @keyframes brandGlow {
            0% { transform: scale(0.98); opacity: 0.9; }
            100% { transform: scale(1.02); opacity: 1; filter: drop-shadow(0 0 25px rgba(129, 228, 218, 0.6)); }
        }

        /* ─── BOTTOM PROGRESS BAR ─── */
        .loader-footer {
            position: relative;
            z-index: 20;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: 260px;
            width: 100%;
        }

        .progress-line {
            width: 100%;
            height: 4px;
            background: rgba(128, 128, 128, 0.2);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 45%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #D95D39, #81E4DA, #5B998C);
            animation: slideFill 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes slideFill {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        /* ─── TOP CONTROL BAR ─── */
        .top-toolbar {
            position: fixed;
            top: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 50px;
            padding: 6px 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            z-index: 100;
        }

        body.dark-mode .top-toolbar {
            background: rgba(18, 22, 34, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            color: white;
        }
    </style>
</head>
<body>

    <!-- ─── TOP CONTROL TOOLBAR ─── -->
    <div class="top-toolbar">
        <button onclick="toggleTheme()" class="px-3 py-1 rounded-full text-xs font-bold transition-all bg-[#183B33] text-white hover:opacity-90 flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-moon"></i> <span id="themeBtnText">Dark Mode</span>
        </button>
        <button onclick="setColors('rankly')" class="px-3 py-1 rounded-full text-xs font-bold transition-all bg-[#D95D39] text-white hover:opacity-90 cursor-pointer">
            Rankly Brand Glow
        </button>
        <button onclick="setColors('figma')" class="px-3 py-1 rounded-full text-xs font-bold transition-all bg-gradient-to-r from-purple-600 to-pink-500 text-white hover:opacity-90 cursor-pointer">
            Figma Coral/Purple Glow
        </button>
        <button onclick="toggleLayer('glow')" class="px-3 py-1 rounded-full text-xs font-bold transition-all bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:opacity-90 cursor-pointer">
            <span id="glowToggleText">Glow: ON</span>
        </button>
        <button onclick="toggleLayer('tiles')" class="px-3 py-1 rounded-full text-xs font-bold transition-all bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:opacity-90 cursor-pointer">
            <span id="tilesToggleText">Tiles: ON</span>
        </button>
        <a href="/" class="px-3 py-1 rounded-full text-xs font-bold transition-all bg-black/10 dark:bg-white/10 hover:bg-black/20 text-gray-800 dark:text-gray-200 cursor-pointer flex items-center gap-1">
            <i class="fa-solid fa-arrow-left text-[10px]"></i> App
        </a>
    </div>

    <!-- ─── LIQUID GLASS STAGE ─── -->
    <div class="stage-container">
        <!-- ─── LAYER 1: VIBRANT RADIAL GLOW (FIGMA EXACT REPLICA) ─── -->
        <div class="glow-layers-wrapper" id="glowLayer">
            <div class="glow-sphere glow-outer" id="glow3"></div>
            <div class="glow-sphere glow-middle" id="glow2"></div>
            <div class="glow-sphere glow-inner" id="glow1"></div>
        </div>

        <!-- ─── LAYER 2: 7x7 (49) LIQUID GLASS TILES GRID ─── -->
        <div class="tiles-grid" id="tilesGrid">
            <!-- 49 tactile glass cushion tiles injected by JS -->
        </div>

        <!-- ─── LAYER 3: CRISP LUMINOUS RANKLY.AI LOGO & TITLE ─── -->
        <div class="rankly-luminous-overlay" id="textLayer">
            <h1 class="brand-title">
                Rankly<span class="brand-dot">.ai</span>
            </h1>
            <p class="brand-subtitle">
                Executive AI Intelligence
            </p>
        </div>
    </div>

    <!-- ─── MINIMALIST LOADER STATUS ─── -->
    <div class="loader-footer">
        <div class="progress-line">
            <div class="progress-fill"></div>
        </div>
        <div class="text-[11px] font-mono text-gray-500 dark:text-gray-400 flex items-center gap-2">
            <i class="fa-solid fa-circle-notch fa-spin text-emerald-500"></i>
            <span id="statusText">Initializing liquid intelligence...</span>
        </div>
    </div>

    <script>
        // Generate 7x7 (49 glass cushion tiles)
        const grid = document.getElementById('tilesGrid');
        for (let r = 0; r < 7; r++) {
            for (let c = 0; c < 7; c++) {
                const tile = document.createElement('div');
                tile.className = 'glass-cushion';
                
                // Radial wave delay from center
                const dist = Math.sqrt(Math.pow(r - 3, 2) + Math.pow(c - 3, 2));
                tile.style.animationDelay = `${(dist * 0.2).toFixed(2)}s`;
                grid.appendChild(tile);
            }
        }

        // Toggle Dark/Light Mode
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtnText').textContent = isDark ? 'Light Mode' : 'Dark Mode';
        }

        // Color Palettes
        function setColors(type) {
            const root = document.documentElement;
            if (type === 'figma') {
                root.style.setProperty('--glow-center', '#FFA24C');
                root.style.setProperty('--glow-mid', '#FF4DA6');
                root.style.setProperty('--glow-outer', '#7952FF');
            } else {
                root.style.setProperty('--glow-center', '#D95D39');
                root.style.setProperty('--glow-mid', '#81E4DA');
                root.style.setProperty('--glow-outer', '#183B33');
            }
        }

        // Layer Toggles (for inspecting individual components)
        function toggleLayer(layer) {
            if (layer === 'glow') {
                const el = document.getElementById('glowLayer');
                const btn = document.getElementById('glowToggleText');
                const isHidden = el.style.display === 'none';
                el.style.display = isHidden ? 'flex' : 'none';
                btn.textContent = isHidden ? 'Glow: ON' : 'Glow: OFF';
            } else if (layer === 'tiles') {
                const el = document.getElementById('tilesGrid');
                const btn = document.getElementById('tilesToggleText');
                const isHidden = el.style.display === 'none';
                el.style.display = isHidden ? 'grid' : 'none';
                btn.textContent = isHidden ? 'Tiles: ON' : 'Tiles: OFF';
            }
        }

        // Loading Status Ticker
        const msgs = [
            'Initializing liquid neural core...',
            'Calibrating scoring engine...',
            'Connecting secure workspace...',
            'Liquid Glass Engine Ready ✨'
        ];
        let idx = 0;
        setInterval(() => {
            idx = (idx + 1) % msgs.length;
            const el = document.getElementById('statusText');
            if (el) el.textContent = msgs[idx];
        }, 1800);
    </script>
</body>
</html>
