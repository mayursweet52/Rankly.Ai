<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Liquid Glass Grid - Direct Rankly Glow | Rankly.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        :root {
            --bg-canvas: #0A0C13;
            --tile-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.03) 100%);
            --tile-border: rgba(255, 255, 255, 0.25);
            --tile-inner-highlight: inset 0 2px 3px rgba(255, 255, 255, 0.5), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
            --tile-outer-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.8), 0 0 2px rgba(255, 255, 255, 0.12);
            --glow-color-1: #D95D39;
            --glow-color-2: #81E4DA;
            --glow-color-3: #5B998C;
            --glow-color-4: #FFA14A;
        }

        body.light-mode {
            --bg-canvas: #F3F4F9;
            --tile-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.1) 100%);
            --tile-border: rgba(255, 255, 255, 0.85);
            --tile-inner-highlight: inset 0 2px 3px rgba(255, 255, 255, 0.95), inset 0 -2px 3px rgba(0, 0, 0, 0.04);
            --tile-outer-shadow: 0 16px 32px -6px rgba(100, 110, 140, 0.22), 0 2px 6px rgba(0, 0, 0, 0.04);
            --glow-color-1: #FFA24C;
            --glow-color-2: #FF4DA6;
            --glow-color-3: #7952FF;
            --glow-color-4: #4EE2C0;
        }

        body {
            background-color: var(--bg-canvas);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 40px 20px;
            transition: background 0.4s ease;
        }

        /* ─── STAGE CONTAINER ─── */
        .glass-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* ─── LAYER 1: MULTI-TIER BACKGROUND GLOW CORE (SHINES THROUGH TILES) ─── */
        .glow-sphere-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        .glow-core {
            position: absolute;
            border-radius: 50%;
            filter: blur(55px);
            animation: fluidCorePulse 6s ease-in-out infinite alternate;
        }

        .glow-core-center {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, var(--glow-color-1) 0%, var(--glow-color-4) 45%, transparent 75%);
            opacity: 0.95;
            z-index: 2;
        }

        .glow-core-orbit-1 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, var(--glow-color-2) 0%, var(--glow-color-3) 55%, transparent 75%);
            opacity: 0.85;
            transform: translate(-30px, -20px);
            animation-delay: -2s;
            z-index: 1;
        }

        .glow-core-orbit-2 {
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, var(--glow-color-3) 0%, var(--glow-color-2) 50%, transparent 75%);
            opacity: 0.7;
            transform: translate(30px, 30px);
            animation-delay: -4s;
            z-index: 0;
        }

        @keyframes fluidCorePulse {
            0% { transform: scale(0.92) rotate(0deg); opacity: 0.8; }
            50% { transform: scale(1.15) rotate(20deg); opacity: 1; }
            100% { transform: scale(0.96) rotate(-15deg); opacity: 0.85; }
        }

        /* ─── LAYER 2: DIRECT RADIANT "RANKLY" GLOW EMBEDDED IN GRID ─── */
        .grid-rankly-glow-embed {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
        }

        /* Pure Luminous Typography Glowing Behind & Through Glass Tiles */
        .rankly-luminous-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -0.04em;
            color: #FFFFFF;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.9),
                0 0 40px var(--glow-color-1),
                0 0 70px var(--glow-color-2),
                0 0 100px var(--glow-color-3);
            animation: textRadiance 3s ease-in-out infinite alternate;
            user-select: none;
            line-height: 1;
        }

        .rankly-luminous-dot {
            color: var(--glow-color-1);
            text-shadow: 
                0 0 25px var(--glow-color-1),
                0 0 50px var(--glow-color-4);
        }

        .rankly-sub-luminous {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px var(--glow-color-2);
            animation: textRadiance 3s ease-in-out infinite alternate-reverse;
        }

        @keyframes textRadiance {
            0% {
                filter: brightness(1) drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
                transform: scale(0.98);
            }
            100% {
                filter: brightness(1.25) drop-shadow(0 0 25px rgba(255, 255, 255, 0.95));
                transform: scale(1.02);
            }
        }

        /* ─── LAYER 3: 7x7 (49) LIQUID GLASS TILES GRID (REFRACTS THE GLOW) ─── */
        .tiles-grid {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(7, 48px);
            grid-template-rows: repeat(7, 48px);
            gap: 10px;
            padding: 16px;
        }

        @media (min-width: 500px) {
            .tiles-grid {
                grid-template-columns: repeat(7, 64px);
                grid-template-rows: repeat(7, 64px);
                gap: 12px;
                padding: 20px;
            }
        }

        @media (min-width: 768px) {
            .tiles-grid {
                grid-template-columns: repeat(7, 78px);
                grid-template-rows: repeat(7, 78px);
                gap: 14px;
                padding: 24px;
            }
        }

        /* ─── INDIVIDUAL LIQUID GLASS TILE CUSHION ─── */
        .tile-cushion {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: var(--tile-bg);
            backdrop-filter: blur(20px) saturate(190%) contrast(110%);
            -webkit-backdrop-filter: blur(20px) saturate(190%) contrast(110%);
            border: 1.5px solid var(--tile-border);
            box-shadow: var(--tile-inner-highlight), var(--tile-outer-shadow);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: cushionBreath 4.5s ease-in-out infinite;
        }

        @media (min-width: 768px) {
            .tile-cushion {
                border-radius: 24px;
            }
        }

        /* Specular Curved Highlight */
        .tile-cushion::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 5px;
            right: 5px;
            height: 38%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.0) 100%);
            border-radius: 16px 16px 8px 8px;
            pointer-events: none;
            opacity: 0.7;
        }

        body.light-mode .tile-cushion::before {
            opacity: 0.9;
        }

        /* Breathing Wave Ripple across Tiles */
        @keyframes cushionBreath {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-5px) scale(1.03); }
        }

        /* Interactive Hover Refraction */
        .tile-cushion:hover {
            transform: translateY(-10px) scale(1.15) !important;
            border-color: rgba(255, 255, 255, 1);
            box-shadow: 0 24px 45px -4px rgba(0, 0, 0, 0.3), inset 0 3px 4px rgba(255, 255, 255, 1), 0 0 25px rgba(255, 255, 255, 0.6);
            z-index: 50;
        }

        /* ─── BOTTOM MINIMALIST GLOWING LOADER BAR ─── */
        .bottom-loader-status {
            position: relative;
            z-index: 20;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 280px;
            width: 100%;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        body.light-mode .progress-track {
            background: rgba(0, 0, 0, 0.08);
        }

        .progress-bar {
            height: 100%;
            width: 50%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #D95D39, #81E4DA, #5B998C);
            box-shadow: 0 0 12px var(--glow-color-2);
            animation: slideProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes slideProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        .status-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body.light-mode .status-badge {
            color: #666660;
        }

        /* ─── TOP CONTROL BAR ─── */
        .top-nav {
            position: fixed;
            top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(18, 22, 34, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            padding: 6px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        body.light-mode .top-nav {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 0, 0, 0.08);
            color: #111;
        }
    </style>
</head>
<body>

    <!-- ─── TOP CONTROLS ─── -->
    <div class="top-nav">
        <button onclick="toggleTheme()" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-[#D95D39] text-white hover:opacity-90 flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-sun"></i> <span id="themeBtnText">Toggle Light Mode</span>
        </button>
        <button onclick="setPalette('rankly')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-[#183B33] border border-white/20 text-white hover:opacity-90 cursor-pointer">
            Rankly Luxury Palette
        </button>
        <button onclick="setPalette('figma')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-gradient-to-r from-purple-600 to-pink-500 text-white hover:opacity-90 cursor-pointer">
            Figma UIUX Palette
        </button>
        <a href="/" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-white/10 hover:bg-white/20 text-white dark:text-white cursor-pointer flex items-center gap-1">
            <i class="fa-solid fa-arrow-left text-[10px]"></i> App
        </a>
    </div>

    <!-- ─── LIQUID GLASS STAGE ─── -->
    <div class="glass-stage">
        <!-- ─── LAYER 1: BLURRED GLOW SPHERES (CORE LIGHT) ─── -->
        <div class="glow-sphere-container">
            <div class="glow-core glow-core-orbit-2" id="glow3"></div>
            <div class="glow-core glow-core-orbit-1" id="glow2"></div>
            <div class="glow-core glow-core-center" id="glow1"></div>
        </div>

        <!-- ─── LAYER 2: DIRECT RADIANT "RANKLY" GLOW THROUGH GRID ─── -->
        <div class="grid-rankly-glow-embed">
            <div class="rankly-luminous-text">
                Rankly<span class="rankly-luminous-dot">.ai</span>
            </div>
            <div class="rankly-sub-luminous">
                Executive AI Intelligence
            </div>
        </div>

        <!-- ─── LAYER 3: 7x7 (49) LIQUID GLASS TILES GRID (REFRACTS DIRECTLY) ─── -->
        <div class="tiles-grid" id="tilesGrid">
            <!-- 49 tactile glass cushion tiles injected by JS -->
        </div>
    </div>

    <!-- ─── MINIMALIST BOTTOM STATUS & LOADER BAR ─── -->
    <div class="bottom-loader-status">
        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>
        <div class="status-badge">
            <i class="fa-solid fa-circle-notch fa-spin text-[#81E4DA]"></i>
            <span id="loaderStatus">Initializing neural intelligence...</span>
        </div>
    </div>

    <script>
        // Generate 7x7 (49 cushion tiles) with radial wave delay
        const grid = document.getElementById('tilesGrid');
        for (let r = 0; r < 7; r++) {
            for (let c = 0; c < 7; c++) {
                const tile = document.createElement('div');
                tile.className = 'tile-cushion';
                
                // Calculate distance from center tile (3, 3)
                const dist = Math.sqrt(Math.pow(r - 3, 2) + Math.pow(c - 3, 2));
                tile.style.animationDelay = `${(dist * 0.22).toFixed(2)}s`;
                
                tile.title = `Liquid Glass Tile (${r + 1}, ${c + 1})`;
                grid.appendChild(tile);
            }
        }

        // Toggle Theme (Dark / Light)
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeBtnText').textContent = isLight ? 'Toggle Dark Mode' : 'Toggle Light Mode';
        }

        // Set Palettes
        function setPalette(type) {
            const root = document.documentElement;
            if (type === 'figma') {
                root.style.setProperty('--glow-color-1', '#FFA24C');
                root.style.setProperty('--glow-color-2', '#FF4DA6');
                root.style.setProperty('--glow-color-3', '#7952FF');
                root.style.setProperty('--glow-color-4', '#4EE2C0');
            } else {
                root.style.setProperty('--glow-color-1', '#D95D39');
                root.style.setProperty('--glow-color-2', '#81E4DA');
                root.style.setProperty('--glow-color-3', '#5B998C');
                root.style.setProperty('--glow-color-4', '#FFA14A');
            }
        }

        // Dynamic Loading Messages
        const msgs = [
            'Initializing neural intelligence...',
            'Calibrating ATS scoring engine...',
            'Connecting enterprise workspace...',
            'Liquid Glass Engine Ready ✨'
        ];
        let step = 0;
        setInterval(() => {
            step = (step + 1) % msgs.length;
            const el = document.getElementById('loaderStatus');
            if (el) el.textContent = msgs[step];
        }, 1800);
    </script>
</body>
</html>
