<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderful Tools — Exact Reel Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #EBE4F7;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }
        .reel-player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #EBE4F7;
        }
        video.reel-exact-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }
        /* Discrete Floating Overlay Watermark */
        .reel-brand-watermark {
            position: absolute;
            bottom: 24px;
            right: 28px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #3C364C;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div class="reel-player-wrapper">
        <video 
            class="reel-exact-video" 
            src="/reel_original.mp4" 
            autoplay 
            loop 
            muted 
            playsinline>
        </video>
        <div class="reel-brand-watermark">
             Wonderful Tools · Bento Motion
        </div>
    </div>
</body>
</html>
