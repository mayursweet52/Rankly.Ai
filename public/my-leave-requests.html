<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Leaves - Rankly.ai</title>
    <link rel="stylesheet" href="/css/tailwind-compiled.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased h-screen flex flex-col md:flex-row overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 h-full flex flex-col hidden md:flex">
        <div class="p-4 border-b border-gray-200">
            <span class="font-bold text-xl text-gray-800">Rankly</span>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="/dashboard.html" class="block px-3 py-2 rounded-md text-sm text-gray-600 hover:bg-gray-50">Dashboard</a>
            <a href="/my-leave-requests.html" class="block px-3 py-2 rounded-md text-sm font-medium bg-indigo-50 text-indigo-700">My Leaves</a>
            <a href="/apply-leave.html" class="block px-3 py-2 rounded-md text-sm text-gray-600 hover:bg-gray-50">Apply Leave</a>
            <a href="/leave-approvals.html" class="block px-3 py-2 rounded-md text-sm text-gray-600 hover:bg-gray-50">Approvals</a>
        </nav>
    </aside>

    <main class="flex-1 overflow-hidden flex flex-col">
        <header class="bg-white border-b border-gray-200 p-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-800">My Leave Requests</h1>
            <a href="/apply-leave.html" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 text-sm font-medium">+ Apply</a>
        </header>

        <div class="flex-1 overflow-y-auto p-6">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-sm text-left whitespace-nowrap">
                    <thead class="bg-gray-50 text-gray-600 font-medium border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-3">Request #</th>
                            <th class="px-6 py-3">Type</th>
                            <th class="px-6 py-3">Duration</th>
                            <th class="px-6 py-3">Days</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3">Applied On</th>
                            <th class="px-6 py-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200">
                        <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = '/login.html';

            const tbody = document.getElementById('table-body');

            function getStatusBadge(status) {
                const map = {
                    PENDING: 'bg-yellow-100 text-yellow-800',
                    APPROVED: 'bg-green-100 text-green-800',
                    REJECTED: 'bg-red-100 text-red-800',
                    CANCELLED: 'bg-gray-100 text-gray-800',
                    WITHDRAWN: 'bg-gray-100 text-gray-800',
                };
                return `<span class="px-2 py-1 rounded-full text-xs font-medium ${map[status] || 'bg-gray-100'}">${status}</span>`;
            }

            async function load() {
                try {
                    // RBAC rules dictate MY_DATA scope if employee
                    const res = await fetch('/api/leave/requests?limit=100', { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await res.json();
                    
                    if (data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">No requests yet</td></tr>';
                        return;
                    }

                    tbody.innerHTML = data.data.map(r => `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 font-mono text-xs text-gray-500">${r.requestNumber}</td>
                            <td class="px-6 py-4">
                                <div class="flex items-center">
                                    <div class="w-3 h-3 rounded-full mr-2" style="background-color: ${r.leaveType?.color || '#ccc'}"></div>
                                    <span class="font-medium text-gray-900">${r.leaveType?.name || 'Unknown'}</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-gray-600">
                                ${new Date(r.fromDate).toLocaleDateString()} &rarr; ${new Date(r.toDate).toLocaleDateString()}
                            </td>
                            <td class="px-6 py-4 font-medium">${r.totalDays}</td>
                            <td class="px-6 py-4">${getStatusBadge(r.status)}</td>
                            <td class="px-6 py-4 text-gray-500 text-xs">${new Date(r.appliedAt).toLocaleDateString()}</td>
                            <td class="px-6 py-4">
                                ${r.status === 'PENDING' ? `<button onclick="cancelReq('${r.id}')" class="text-red-600 hover:text-red-800 text-sm font-medium">Cancel</button>` : ''}
                            </td>
                        </tr>
                    `).join('');
                } catch(err) {
                    console.error(err);
                    tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-red-500">Error loading data</td></tr>';
                }
            }

            window.cancelReq = async (id) => {
                if (!confirm('Are you sure you want to cancel this request?')) return;
                try {
                    const res = await fetch(`/api/leave/requests/${id}/cancel`, { 
                        method: 'PUT', 
                        headers: { 'Authorization': `Bearer ${token}` } 
                    });
                    if (res.ok) load();
                    else alert(await res.text());
                } catch(e) { console.error(e); }
            };

            load();
        });
    </script>
</body>
</html>
