<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankly.Ai | Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- LottieFiles Web Player CDN -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Rankly.ai Signature Precision Palette */
            --bg-page: #F5F5F0;
            --text-main: #183B33;
            --brand-teal: #5B998C;
            --brand-mint: #81E4DA;
            --brand-glow: rgba(91, 153, 140, 0.45);
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(229, 229, 223, 0.8);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #0B0D14;
                --text-main: #FFFFFF;
                --brand-teal: #5B998C;
                --brand-mint: #81E4DA;
                --brand-glow: rgba(129, 228, 218, 0.5);
                --card-bg: rgba(18, 20, 31, 0.7);
                --card-border: rgba(255, 255, 255, 0.08);
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.4s ease;
            position: relative;
        }

        /* Ambient Glow Orb */
        .ambient-glow {
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(91, 153, 140, 0.18) 0%, rgba(129, 228, 218, 0.08) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .loader-card {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 48px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            box-shadow: 
                0 24px 48px -12px rgba(0, 0, 0, 0.06),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            gap: 20px;
            animation: cardFloat 3.5s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* ─── ICONIC ANIMATED "R" LOTTIE / SVG MOTION WRAPPER ─── */
        .r-anim-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer Orbiting Energy Ring */
        .energy-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px dashed rgba(91, 153, 140, 0.35);
            animation: rotateRing 12s linear infinite;
        }

        @keyframes rotateRing {
            to { transform: rotate(360deg); }
        }

        /* Outer Glowing Arc */
        .energy-arc {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2.5px solid transparent;
            border-top-color: var(--brand-mint);
            border-right-color: var(--brand-teal);
            filter: drop-shadow(0 0 8px var(--brand-glow));
            animation: rotateArc 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes rotateArc {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animated Drawing "R" Vector */
        .r-svg-icon {
            width: 110px;
            height: 110px;
            filter: drop-shadow(0 8px 16px rgba(24, 59, 51, 0.18));
            animation: rHeartbeat 2.4s ease-in-out infinite;
        }

        @keyframes rHeartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); filter: drop-shadow(0 12px 24px var(--brand-glow)); }
        }

        /* Stroke Dashoffset Drawing Animation on Letter "R" */
        .r-stroke-main {
            stroke-dasharray: 260;
            stroke-dashoffset: 260;
            animation: drawR 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        .r-stroke-loop {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawLoop 2.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s infinite alternate;
        }

        .r-stroke-leg {
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            animation: drawLeg 2.8s cubic-bezier(0.4, 0, 0.2, 1) 0.6s infinite alternate;
        }

        @keyframes drawR {
            0% { stroke-dashoffset: 260; }
            60%, 100% { stroke-dashoffset: 0; }
        }

        @keyframes drawLoop {
            0% { stroke-dashoffset: 200; }
            60%, 100% { stroke-dashoffset: 0; }
        }

        @keyframes drawLeg {
            0% { stroke-dashoffset: 120; }
            60%, 100% { stroke-dashoffset: 0; }
        }

        /* ─── BRAND TYPOGRAPHY & LOADING PROGRESS ─── */
        .brand-name {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .brand-name .text-gradient {
            background: linear-gradient(135deg, var(--text-main) 0%, var(--brand-teal) 50%, var(--brand-mint) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        .badge-ai {
            background: #183B33;
            color: #81E4DA;
            font-size: 13px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            margin-left: 6px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid rgba(129, 228, 218, 0.3);
            box-shadow: 0 2px 8px rgba(129, 228, 218, 0.25);
        }

        /* Status Ticker */
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            font-weight: 600;
            color: #666660;
            letter-spacing: 0.04em;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--brand-mint);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--brand-mint);
            animation: blinkStatus 1.2s ease-in-out infinite alternate;
        }

        @keyframes blinkStatus {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Sleek Loading Progress Beam */
        .progress-track {
            width: 200px;
            height: 4px;
            background: rgba(229, 229, 223, 0.6);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, #183B33 0%, var(--brand-teal) 50%, var(--brand-mint) 100%);
            border-radius: 10px;
            position: absolute;
            animation: travelProgress 2s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(129, 228, 218, 0.85);
        }

        @keyframes travelProgress {
            0% { left: -40%; width: 25%; }
            50% { left: 35%; width: 45%; }
            100% { left: 110%; width: 25%; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="loader-card">
        <!-- Iconic Letter "R" Motion Graphic -->
        <div class="r-anim-wrapper">
            <div class="energy-ring"></div>
            <div class="energy-arc"></div>

            <svg class="r-svg-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="rGradMain" x1="20" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#183B33"/>
                        <stop offset="50%" stop-color="#5B998C"/>
                        <stop offset="100%" stop-color="#81E4DA"/>
                    </linearGradient>
                    <linearGradient id="rGradGlow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#81E4DA"/>
                        <stop offset="100%" stop-color="#00FFCC"/>
                    </linearGradient>
                    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>

                <!-- Background Base Plate -->
                <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#rGradMain)" fill-opacity="0.08" stroke="url(#rGradMain)" stroke-width="1.5" stroke-opacity="0.3"/>

                <!-- Left Spine Path -->
                <path class="r-stroke-main" d="M34 24V76" stroke="url(#rGradMain)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Upper Loop Path -->
                <path class="r-stroke-loop" d="M34 28H54C62.8 28 69 34.2 69 43C69 51.8 62.8 58 54 58H34" stroke="url(#rGradMain)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Diagonal Kick Leg -->
                <path class="r-stroke-leg" d="M48 57L67 76" stroke="url(#rGradGlow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)"/>

                <!-- Glowing Core Dot -->
                <circle cx="54" cy="43" r="4.5" fill="#81E4DA" filter="url(#glowFilter)">
                    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite"/>
                </circle>

                <!-- Floating Accent Particle -->
                <circle cx="74" cy="22" r="3.5" fill="#81E4DA">
                    <animate attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="2.5s" repeatCount="indefinite"/>
                </circle>
            </svg>
        </div>

        <!-- Typography & Progress Indicator -->
        <div class="brand-name">
            <span class="text-gradient">Rankly</span><span class="badge-ai">Ai</span>
        </div>

        <div class="status-row">
            <div class="status-dot"></div>
            <span id="loadingStatus">INITIALIZING RECRUITMENT INTELLIGENCE...</span>
        </div>

        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        // Rotating Loading Status Messages
        const statusMsgs = [
            "INITIALIZING RECRUITMENT INTELLIGENCE...",
            "CALIBRATING NEURAL ATS RESUME ENGINE...",
            "SYNCHRONIZING AI INTERVIEW MATRIX...",
            "SECURING ENTERPRISE WORKSPACE..."
        ];
        let statusIdx = 0;
        const statusEl = document.getElementById('loadingStatus');

        setInterval(() => {
            statusIdx = (statusIdx + 1) % statusMsgs.length;
            if (statusEl) {
                statusEl.style.opacity = '0';
                setTimeout(() => {
                    statusEl.textContent = statusMsgs[statusIdx];
                    statusEl.style.opacity = '1';
                }, 250);
            }
        }, 2200);
    </script>

</body>
</html>
