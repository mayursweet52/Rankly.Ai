<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankly.Ai | Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* ─── Ultra-Vibrant Multi-Dimensional Cyber Palette ─── */
            --bg-page: #090B10;
            --text-main: #FFFFFF;
            --c-violet: #8B5CF6;
            --c-indigo: #6366F1;
            --c-cyan: #06B6D4;
            --c-emerald: #10B981;
            --c-coral: #F43F5E;
            --card-bg: rgba(15, 18, 28, 0.75);
            --card-border: rgba(139, 92, 246, 0.25);
            --glow-primary: rgba(139, 92, 246, 0.5);
            --glow-cyan: rgba(6, 182, 212, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        /* Dual Ambient Neon Aurora Glows */
        .ambient-glow-1 {
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, rgba(99, 102, 241, 0.12) 40%, transparent 70%);
            border-radius: 50%;
            top: 20%;
            left: 30%;
            pointer-events: none;
            filter: blur(60px);
            animation: pulseAurora 6s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.22) 0%, rgba(16, 185, 129, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            bottom: 20%;
            right: 30%;
            pointer-events: none;
            filter: blur(60px);
            animation: pulseAurora2 7s ease-in-out infinite alternate;
        }

        @keyframes pulseAurora {
            0% { transform: translate(-10%, -10%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(10%, 10%) scale(1.15); opacity: 1; }
        }

        @keyframes pulseAurora2 {
            0% { transform: translate(10%, 10%) scale(0.9); opacity: 0.5; }
            100% { transform: translate(-10%, -10%) scale(1.2); opacity: 0.95; }
        }

        /* Glassmorphic Loader Container */
        .loader-card {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 44px 54px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 36px;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                0 0 40px -10px rgba(139, 92, 246, 0.2),
                inset 0 1px 2px rgba(255, 255, 255, 0.15);
            gap: 22px;
            animation: cardFloat 4s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        /* ─── ANIMATED "R" LOTTIE / MOTION GRAPHIC ─── */
        .r-anim-wrapper {
            position: relative;
            width: 145px;
            height: 145px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer Orbiting Dashed Energy Ring */
        .energy-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px dashed rgba(139, 92, 246, 0.4);
            animation: rotateRing 14s linear infinite;
        }

        @keyframes rotateRing {
            to { transform: rotate(360deg); }
        }

        /* Outer Glowing Neon Dual Arc */
        .energy-arc {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--c-cyan);
            border-right-color: var(--c-violet);
            border-bottom-color: var(--c-emerald);
            filter: drop-shadow(0 0 12px var(--glow-cyan));
            animation: rotateArc 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes rotateArc {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animated SVG Vector */
        .r-svg-icon {
            width: 115px;
            height: 115px;
            filter: drop-shadow(0 10px 25px rgba(139, 92, 246, 0.35));
            animation: rHeartbeat 2.6s ease-in-out infinite;
        }

        @keyframes rHeartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); filter: drop-shadow(0 14px 30px rgba(6, 182, 212, 0.55)); }
        }

        /* Animated Stroke Dashoffset Lines */
        .r-stroke-main {
            stroke-dasharray: 260;
            stroke-dashoffset: 260;
            animation: drawR 3s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        .r-stroke-loop {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawLoop 3s cubic-bezier(0.4, 0, 0.2, 1) 0.35s infinite alternate;
        }

        .r-stroke-leg {
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            animation: drawLeg 3s cubic-bezier(0.4, 0, 0.2, 1) 0.7s infinite alternate;
        }

        @keyframes drawR {
            0% { stroke-dashoffset: 260; }
            55%, 100% { stroke-dashoffset: 0; }
        }

        @keyframes drawLoop {
            0% { stroke-dashoffset: 200; }
            55%, 100% { stroke-dashoffset: 0; }
        }

        @keyframes drawLeg {
            0% { stroke-dashoffset: 120; }
            55%, 100% { stroke-dashoffset: 0; }
        }

        /* ─── BRAND TYPOGRAPHY & LOADING PROGRESS ─── */
        .brand-name {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .brand-name .text-gradient {
            background: linear-gradient(135deg, #FFFFFF 0%, #C4B5FD 30%, #67E8F9 70%, #6EE7B7 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3.5s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        .badge-ai {
            background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%);
            color: #FFFFFF;
            font-size: 13.5px;
            font-weight: 800;
            padding: 2.5px 8px;
            border-radius: 7px;
            margin-left: 6px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 2px 12px rgba(139, 92, 246, 0.4);
            animation: badgePulse 2s ease-in-out infinite alternate;
        }

        @keyframes badgePulse {
            0% { box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3); transform: scale(1); }
            100% { box-shadow: 0 4px 18px rgba(6, 182, 212, 0.6); transform: scale(1.04); }
        }

        /* Status Ticker */
        .status-row {
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            color: #94A3B8;
            letter-spacing: 0.04em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--c-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--c-cyan);
            animation: blinkStatus 1.2s ease-in-out infinite alternate;
        }

        @keyframes blinkStatus {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.25); }
        }

        /* Sleek Loading Progress Beam */
        .progress-track {
            width: 220px;
            height: 4.5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, #8B5CF6 0%, #06B6D4 50%, #10B981 100%);
            border-radius: 10px;
            position: absolute;
            animation: travelProgress 2.2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.9);
        }

        @keyframes travelProgress {
            0% { left: -40%; width: 25%; }
            50% { left: 35%; width: 45%; }
            100% { left: 110%; width: 25%; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="loader-card">
        <!-- Iconic Letter "R" Motion Graphic -->
        <div class="r-anim-wrapper">
            <div class="energy-ring"></div>
            <div class="energy-arc"></div>

            <svg class="r-svg-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="rGradMain" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#C084FC"/>
                        <stop offset="35%" stop-color="#8B5CF6"/>
                        <stop offset="70%" stop-color="#6366F1"/>
                        <stop offset="100%" stop-color="#06B6D4"/>
                    </linearGradient>

                    <linearGradient id="rGradCoral" x1="30" y1="40" x2="80" y2="85" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#38BDF8"/>
                        <stop offset="50%" stop-color="#06B6D4"/>
                        <stop offset="100%" stop-color="#10B981"/>
                    </linearGradient>

                    <linearGradient id="rGradCard" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
                    </linearGradient>

                    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3.5" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>

                <!-- Base Card -->
                <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#rGradCard)" stroke="url(#rGradMain)" stroke-width="1.8" stroke-opacity="0.5"/>

                <!-- Left Spine Path -->
                <path class="r-stroke-main" d="M34 24V76" stroke="url(#rGradMain)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)"/>

                <!-- Upper Loop Path -->
                <path class="r-stroke-loop" d="M34 28H54C62.8 28 69 34.2 69 43C69 51.8 62.8 58 54 58H34" stroke="url(#rGradMain)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)"/>

                <!-- Diagonal Kick Leg -->
                <path class="r-stroke-leg" d="M48 57L67 76" stroke="url(#rGradCoral)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)"/>

                <!-- Floating Gem Particle -->
                <circle cx="72" cy="24" r="4" fill="#06B6D4" filter="url(#glowFilter)">
                    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
                </circle>

                <!-- Inner Core Accent Dot -->
                <circle cx="54" cy="43" r="4.5" fill="#FFFFFF" opacity="0.9" filter="url(#glowFilter)"/>
            </svg>
        </div>

        <!-- Typography & Progress Indicator -->
        <div class="brand-name">
            <span class="text-gradient">Rankly</span><span class="badge-ai">Ai</span>
        </div>

        <div class="status-row">
            <div class="status-dot"></div>
            <span id="loadingStatus">INITIALIZING RECRUITMENT INTELLIGENCE...</span>
        </div>

        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        const statusMsgs = [
            "INITIALIZING RECRUITMENT INTELLIGENCE...",
            "CALIBRATING NEURAL ATS RESUME ENGINE...",
            "SYNCHRONIZING AI INTERVIEW MATRIX...",
            "SECURING ENTERPRISE WORKSPACE..."
        ];
        let statusIdx = 0;
        const statusEl = document.getElementById('loadingStatus');

        setInterval(() => {
            statusIdx = (statusIdx + 1) % statusMsgs.length;
            if (statusEl) {
                statusEl.style.opacity = '0';
                setTimeout(() => {
                    statusEl.textContent = statusMsgs[statusIdx];
                    statusEl.style.opacity = '1';
                }, 220);
            }
        }, 2200);
    </script>

</body>
</html>
